    .container {
        max-width: 800px;

    button {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: #29b6f6;
        color: #fff;
        cursor: pointer;
        transition: 0.2s;

    .choice { 
        background: #f5f5f5; 
        color: #333; 
        text-align: left;
        padding-left: 25px;
        box-shadow: 0 4px 0 #e0e0e0;
        color: #444;
    }
    .choice:hover { background: #e3f2fd; color: #0277bd; }

    .explain-box {
        text-align: left;
        padding: 20px;
        margin: 15px 0;
        border-radius: 12px;
        background-color: #ffffff;
        border: 1px solid #eee;
        font-size: 16px;
        line-height: 1.6;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

        background-color: #e8f5e9;

        color: #1b5e20;
    }
    .explain-wrong {

        color: #b71c1c;
    }

    #subject_list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        color: #333;

// ---------- ส่วนจัดการเพลง (Music System) ----------
var audio = document.getElementById("bgMusic");
var musicBtn = document.getElementById("musicBtn");
var isPlaying = false;

function startGame() {
    // พยายามเล่นเพลงทันทีที่ user กดปุ่มเริ่ม
    audio.volume = 0.4; // ปรับเสียงไม่ให้ดังเกินไป (40%)
    var playPromise = audio.play();

    if (playPromise !== undefined) {
        playPromise.then(_ => {
            // เล่นสำเร็จ
            isPlaying = true;
            updateMusicButton();
            goLevel(); // ไปหน้าเลือกระดับชั้น
        })
        .catch(error => {
            // เล่นไม่สำเร็จ (หาไฟล์ไม่เจอ หรือ Browser บล็อก)
            console.log("Music Error: " + error);
            alert("⚠️ แจ้งเตือนเรื่องเสียง:\nเล่นเพลงไม่ได้ครับ อาจเพราะ:\n1. หาไฟล์ Aaaaaaaaaa.mp3 ไม่เจอ\n2. ชื่อไฟล์ผิด\n\n(แต่เกมเล่นต่อได้ปกตินะครับ)");
            goLevel(); // ไปหน้าถัดไปอยู่ดี
        });
    } else {
        goLevel();
    }
}

function toggleMusic() {
    if (isPlaying) {
        audio.pause();
        isPlaying = false;
    } else {
        audio.play().catch(e => console.log(e));
        isPlaying = true;
    }
    updateMusicButton();
}

function updateMusicButton() {
    if (isPlaying) {
        musicBtn.innerHTML = "🔊 เปิดเพลงอยู่";
        musicBtn.style.background = "#66bb6a"; // เขียว
        musicBtn.style.color = "#fff";
    } else {
        musicBtn.innerHTML = "🔇 เพลงปิดอยู่";
        musicBtn.style.background = "#ffca28"; // เหลือง
        musicBtn.style.color = "#333";
    }
}

        { q: "10. อุปกรณ์ป้องกันดวงตา (เช่น แว่นนิรภัย) ใช้เพื่ออะไร", options: ["ก. ป้องกันสารเคมีหรือเศษวัตถุเข้าตา", "ข. เพื่อแฟชั่น", "ค. เพื่อเล่นกีฬา", "ง. เพื่อถ่ายรูป", "จ. เพื่อป้องกันฝน"], answer: 0, explain: ["เฉลย: ก. ถูก เพราะแว่นนิรภัยออกแบบมาเพื่อรับแรงกระแทกและป้องกันสารเคมีกระเด็น", "ข. ผิด เพราะแว่นแฟชั่นไม่มีมาตรฐานความปลอดภัยรองรับ", "ค. ผิด เพราะแว่นกีฬาออกแบบมาเพื่อวัตถุประสงค์อื่น", "ง. ผิด เพราะเป็นการใช้งานผิดวัตถุประสงค์", "จ. ผิด เพราะไม่ใช่วัตถุประสงค์หลักของแว่นนิรภัย"] }

        { q: "1. โปรแกรมประมวลผลคำ (Word Processing) มีจุดประสงค์หลักเพื่ออะไร", options: ["ก. ใช้ในการวาดภาพเวกเตอร์", "ข. ใช้สำหรับสร้าง แก้ไข และจัดรูปแบบเอกสาร", "ค. ใช้สำหรับคำนวณสูตรทางบัญชี", "ง. ใช้ในการตัดต่อไฟล์วิดีโอความละเอียดสูง", "จ. ใช้ในการเล่นไฟล์มัลติมีเดีย"], answer: 1, explain: ["ก. ผิด เพราะเป็นหน้าที่ของโปรแกรมกราฟิก", "เฉลย: ข. ถูก เพราะเป็นหน้าที่หลักของโปรแกรมประเภทนี้", "ค. ผิด เพราะเป็นหน้าที่ของโปรแกรมตารางคำนวณ (Spreadsheet)", "ง. ผิด เพราะเป็นหน้าที่ของโปรแกรมตัดต่อวิดีโอ", "จ. ผิด เพราะเป็นหน้าที่ของโปรแกรมเล่นสื่อ (Media Player)"] },
        { q: "2. หากต้องการพิมพ์เอกสารออกทางเครื่องพิมพ์ (Printer) ต้องใช้คำสั่งใด", options: ["ก. Save", "ข. Open", "ค. Cut", "ง. Paste", "จ. Print"], answer: 4, explain: ["ก. ผิด เพราะ Save ใช้บันทึกข้อมูล", "ข. ผิด เพราะ Open ใช้เปิดไฟล์", "ค. ผิด เพราะ Cut ใช้ตัดข้อความ", "ง. ผิด เพราะ Paste ใช้สำหรับวางข้อความ", "เฉลย: จ. ถูก เพราะ Print คือคำสั่งพิมพ์เอกสาร"] },

        { q: "4. การจัดย่อหน้าแบบ Justify จะส่งผลต่อเอกสารอย่างไร", options: ["ก. ข้อความจะถูกจัดให้ชิดขอบซ้ายและขวาเท่ากันอย่างเป็นระเบียบ", "ข. ข้อความจะชิดขอบซ้ายเพียงอย่างเดียว", "ค. ข้อความจะไปรวมกันอยู่ที่กึ่งกลางหน้ากระดาษ", "ง. ข้อความจะถูกจัดให้ชิดขอบขวาเพียงอย่างเดียว", "จ. ข้อความจะถูกกระจายแบบสุ่มในหน้ากระดาษ"], answer: 0, explain: ["เฉลย: ก. ถูก เพราะ Justify คือการจัดให้ขอบทั้งสองด้านเรียบเสมอกัน", "ข. ผิด เพราะเป็นการจัดแบบ Align Left", "ค. ผิด เพราะเป็นการจัดแบบ Center", "ง. ผิด เพราะเป็นการจัดแบบ Align Right", "จ. ผิด เพราะโปรแกรมไม่มีการจัดแบบสุ่ม"] },
        { q: "5. เมนู Header และ Footer มักใช้เพื่อวัตถุประสงค์ใด", options: ["ก. ใช้เพิ่มรูปภาพขนาดใหญ่กลางหน้ากระดาษ", "ข. ใช้แสดงข้อมูลส่วนหัวและส่วนท้ายหน้า เช่น เลขหน้า หรือชื่อบท", "ค. ใช้สำหรับเปลี่ยนสีพื้นหลังของหน้าเอกสารทั้งหมด", "ง. ใช้สำหรับตรวจสอบคำผิดในเอกสาร", "จ. ใช้สำหรับบันทึกไฟล์เป็นนามสกุลอื่น"], answer: 1, explain: ["ก. ผิด เพราะรูปภาพแทรกได้ที่เมนู Insert Picture", "เฉลย: ข. ถูก เพราะ Header คือส่วนหัว และ Footer คือส่วนท้ายของหน้ากระดาษ", "ค. ผิด เพราะสีพื้นหลังตั้งค่าที่ Page Color", "ง. ผิด เพราะตรวจคำผิดใช้ Spelling & Grammar", "จ. ผิด เพราะเปลี่ยนนามสกุลใช้ Save As"] },
        { q: "6. การใช้งาน Styles ใน Microsoft Word มีข้อดีที่โดดเด่นที่สุดในเรื่องใด", options: ["ก. ช่วยให้สามารถบันทึกไฟล์ได้เร็วขึ้นกว่าปกติ", "ข. ช่วยให้กำหนดรูปแบบข้อความ (เช่น หัวข้อ) ให้เหมือนกันได้ทั้งเอกสารอย่างรวดเร็ว", "ค. ช่วยเพิ่มความเร็วในการพิมพ์ตัวอักษร", "ง. ช่วยในการสแกนไวรัสที่อาจติดมากับไฟล์เอกสาร", "จ. ช่วยในการวาดตารางที่ซับซ้อน"], answer: 1, explain: ["ก. ผิด เพราะไม่เกี่ยวกับความเร็วในการบันทึก", "เฉลย: ข. ถูก เพราะ Styles ใช้ควบคุมชุดรูปแบบข้อความให้คงที่และเป็นมาตรฐาน", "ค. ผิด เพราะไม่ได้ช่วยให้พิมพ์เร็วขึ้น", "ง. ผิด เพราะโปรแกรมประมวลผลคำไม่ใช่โปรแกรมสแกนไวรัส", "จ. ผิด เพราะตารางใช้เมนู Insert Table"] },
        { q: "7. คำสั่ง Layout > Margins มีไว้สำหรับตั้งค่าสิ่งใด", options: ["ก. กำหนดขนาดของตัวอักษร", "ข. กำหนดขอบเขตระยะห่างระหว่างเนื้อหากับขอบกระดาษ", "ค. กำหนดจำนวนตารางในหนึ่งหน้า", "ง. กำหนดความเข้มของหมึกพิมพ์", "จ. กำหนดการสะกดคำอัตโนมัติ"], answer: 1, explain: ["ก. ผิด เพราะขนาดตัวอักษรตั้งที่เมนู Home > Font", "เฉลย: ข. ถูก เพราะ Margins คือการตั้งค่าระยะขอบกระดาษ", "ค. ผิด เพราะจำนวนตารางกำหนดตอนแทรกตาราง", "ง. ผิด เพราะความเข้มหมึกตั้งที่ Printer Properties", "จ. ผิด เพราะการสะกดคำตั้งที่เมนู Review"] },
        { q: "8. Section Break มีความสำคัญอย่างไรในการจัดทำเอกสารขนาดใหญ่", options: ["ก. ใช้สำหรับตัดข้อความทิ้งโดยไม่เก็บไว้ในถังขยะ", "ข. ใช้แบ่งเอกสารเป็นส่วนๆ เพื่อกำหนดรูปแบบหน้ากระดาษ (เช่น แนวตั้ง/แนวนอน) ให้ต่างกันได้ในไฟล์เดียว", "ค. ใช้สำหรับหยุดการทำงานของโปรแกรมชั่วคราว", "ง. ใช้สำหรับแทรกหน้าว่างเปล่าเข้าไปหลายๆ หน้าพร้อมกัน", "จ. ใช้สำหรับการบันทึกเอกสารอัตโนมัติทุกๆ 5 นาที"], answer: 1, explain: ["ก. ผิด เพราะการลบใช้ Delete/Backspace", "เฉลย: ข. ถูก เพราะ Section Break ใช้แยกส่วนเพื่อตั้งค่าหน้ากระดาษที่แตกต่างกันในไฟล์เดียวกัน", "ค. ผิด เพราะไม่เกี่ยวกับการหยุดโปรแกรม", "ง. ผิด เพราะหน้าว่างใช้ Blank Page", "จ. ผิด เพราะบันทึกอัตโนมัติคือเมนู AutoSave"] },
        { q: "9. หากพบเส้นหยักสีแดงใต้ข้อความ หมายความว่าโปรแกรมกำลังแจ้งเตือนเรื่องใด", options: ["ก. ข้อความนั้นเป็นข้อความที่สำคัญมาก", "ข. ข้อความนั้นอาจสะกดผิดตามพจนานุกรมของโปรแกรม", "ค. ข้อความนั้นมีการคัดลอกมาจากแหล่งอื่น", "ง. ข้อความนั้นเป็นตัวหนาเกินไป", "จ. ข้อความนั้นถูกบันทึกเรียบร้อยแล้ว"], answer: 1, explain: ["ก. ผิด เพราะโปรแกรมไม่สามารถรู้ความสำคัญของเนื้อหาได้", "เฉลย: ข. ถูก เพราะเส้นสีแดงแสดงถึงการสะกดคำที่โปรแกรมไม่คุ้นเคยหรืออาจผิด", "ค. ผิด เพราะไม่ใช่การตรวจลิขสิทธิ์", "ง. ผิด เพราะความหนาไม่มีการแจ้งเตือนด้วยเส้นหยัก", "จ. ผิด เพราะการบันทึกไม่แสดงด้วยเส้นหยักใต้ข้อความ"] },
        { q: "10. Template คืออะไรในระบบประมวลผลคำ", options: ["ก. ไฟล์เอกสารเปล่าที่ไม่มีการตั้งค่าใดๆ", "ข. โปรแกรมเสริมสำหรับตกแต่งรูปภาพ", "ค. เอกสารต้นแบบสำเร็จรูปที่จัดรูปแบบไว้แล้ว พร้อมให้นำไปใช้งานหรือปรับแต่งได้ทันที", "ง. การพิมพ์เอกสารออกทางหน้าจอคอมพิวเตอร์", "จ. รหัสผ่านสำหรับการเปิดไฟล์เอกสาร"], answer: 2, explain: ["ก. ผิด เพราะเอกสารเปล่าคือ Blank Document", "ข. ผิด เพราะไม่ใช่โปรแกรมกราฟิก", "เฉลย: ค. ถูก เพราะ Template คือแม่แบบสำเร็จรูปที่ช่วยลดเวลาในการจัดรูปแบบ", "ง. ผิด เพราะการแสดงผลคือการ Print Preview/Display", "จ. ผิด เพราะรหัสผ่านคือ Password Protection"] }

    "การเขียนโปรแกรมภาษาคอมพิวเตอร์": [
        { q: "1. ขั้นตอนแรกของวงจรการพัฒนาโปรแกรม (SDLC) คือข้อใด", options: ["ก. การเขียนโปรแกรม (Coding)", "ข. การวิเคราะห์ปัญหา (Problem Analysis)", "ค. การทดสอบโปรแกรม (Testing)", "ง. การออกแบบโปรแกรม (Design)", "จ. การบำรุงรักษา (Maintenance)"], answer: 1, explain: ["ก. ผิด เพราะการเขียนโค้ดจะทำหลังจากวิเคราะห์และออกแบบเสร็จแล้ว", "เฉลย: ข. ถูก เพราะต้องทำความเข้าใจปัญหาและข้อกำหนดก่อนเริ่มขั้นตอนอื่น", "ค. ผิด เพราะการทดสอบทำหลังจากเขียนโปรแกรมเสร็จ", "ง. ผิด เพราะการออกแบบเป็นขั้นตอนที่สองหลังจากวิเคราะห์ปัญหา", "จ. ผิด เพราะเป็นขั้นตอนสุดท้ายหลังจากใช้งานจริง"] },
        { q: "2. ข้อใดคือความหมายของ \"อัลกอริทึม\" (Algorithm)", options: ["ก. ภาษาที่คอมพิวเตอร์เข้าใจเท่านั้น", "ข. ขั้นตอนการทำงานเพื่อแก้ปัญหาอย่างเป็นระบบ", "ค. อุปกรณ์ฮาร์ดแวร์ที่ใช้รันโปรแกรม", "ง. การตกแต่งหน้าตาโปรแกรมให้สวยงาม", "จ. การจัดเก็บข้อมูลลงในฐานข้อมูล"], answer: 1, explain: ["ก. ผิด เพราะอัลกอริทึมเขียนเป็นภาษาคนหรือผังงานก็ได้", "เฉลย: ข. ถูก เพราะเป็นลำดับขั้นตอนที่ชัดเจนในการแก้ปัญหาใดปัญหาหนึ่ง", "ค. ผิด เพราะเป็นกระบวนการทางตรรกะ ไม่ใช่อุปกรณ์", "ง. ผิด เพราะการตกแต่งเป็นส่วนของ UI Design", "จ. ผิด เพราะเป็นส่วนหนึ่งของการจัดการข้อมูล ไม่ใช่ตัวอัลกอริทึมทั้งหมด"] },
        { q: "3. สัญลักษณ์ผังงาน (Flowchart) รูปสี่เหลี่ยมข้าวหลามตัด (Diamond) หมายถึงอะไร", options: ["ก. การเริ่มต้นหรือสิ้นสุด", "ข. การประมวลผล (Process)", "ค. การรับหรือแสดงข้อมูล", "ง. การตัดสินใจ (Decision)", "จ. จุดเชื่อมต่อ (Connector)"], answer: 3, explain: ["ก. ผิด เพราะเริ่มต้น/สิ้นสุด ใช้รูปวงรีหรือสี่เหลี่ยมมุมมน", "ข. ผิด เพราะการประมวลผลใช้รูปสี่เหลี่ยมผืนผ้า", "ค. ผิด เพราะการรับ/แสดงผลทั่วไปใช้รูปสี่เหลี่ยมด้านขนาน", "เฉลย: ง. ถูก เพราะใช้สำหรับการเปรียบเทียบเงื่อนไขเพื่อเลือกทิศทางการทำงาน", "จ. ผิด เพราะจุดเชื่อมต่อใช้รูปวงกลมขนาดเล็ก"] },
        { q: "4. ข้อใดคือลักษณะของ \"ซูโดโค้ด\" (Pseudo Code) ที่ถูกต้อง", options: ["ก. ต้องเขียนเป็นภาษาอังกฤษตามไวยากรณ์คอมพิวเตอร์เป๊ะๆ", "ข. เป็นการเขียนเลียนแบบคำสั่งโปรแกรมด้วยภาษาธรรมชาติ", "ค. เป็นการวาดรูปภาพแสดงลำดับการทำงาน", "ง. เป็นการแปลงโค้ดให้เป็นเลขฐานสอง", "จ. เป็นการเขียนคำสั่งเพื่อจองพื้นที่ในหน่วยความจำ"], answer: 1, explain: ["ก. ผิด เพราะไม่ยึดติดกับไวยากรณ์ (Syntax) ของภาษาใดภาษาหนึ่ง", "เฉลย: ข. ถูก เพราะเป็นรหัสจำลองที่ช่วยให้โปรแกรมเมอร์เข้าใจลำดับงานก่อนเขียนโค้ดจริง", "ค. ผิด เพราะการวาดรูปคือผังงาน (Flowchart)", "ง. ผิด เพราะนั่นคือหน้าที่ของ Compiler", "จ. ผิด เพราะเป็นรายละเอียดในขั้นตอนการเขียนโค้ดจริง"] },

        { q: "7. ประโยคใดต่อไปนี้เป็นการขึ้นต้นอีเมลที่เขียนถึงผู้ที่เราไม่ทราบชื่อ?", options: ["ก. Dear John,", "ข. Hi there,", "ค. To whom it may concern,", "ง. Dear Friend,", "จ. See you soon,"], answer: 2, explain: ["ก. ผิด เพราะใช้เมื่อทราบชื่อผู้รับชัดเจน", "ข. ผิด เพราะเป็นภาษาพูด ไม่เป็นทางการ", "เฉลย: ค. ถูก เพราะใช้เมื่อไม่ทราบชื่อผู้รับ หรือส่งถึงหน่วยงานโดยรวม", "ง. ผิด เพราะไม่นิยมใช้ในจดหมายกึ่งทางการหรือทางการ", "จ. ผิด เพราะเป็นคำลงท้ายจดหมาย"] },

        { q: "9. คำศัพท์ในแบบฟอร์มข้อใด หมายถึง \"ที่อยู่ปัจจุบัน\"?", options: ["ก. Permanent Address", "ข. Office Address", "ค. Present Address", "ง. Mailing Address", "จ. Previous Address"], answer: 2, explain: ["ก. ผิด เพราะหมายถึง ที่อยู่ตามทะเบียนบ้าน/ที่อยู่ถาวร", "ข. ผิด เพราะหมายถึง ที่อยู่สำนักงาน", "เฉลย: ค. ถูก เพราะ Present Address หมายถึง ที่อยู่ที่ติดต่อได้ในปัจจุบัน", "ง. ผิด เพราะหมายถึง ที่อยู่สำหรับจดหมาย (อาจเป็นตู้ ปณ.)", "จ. ผิด เพราะหมายถึง ที่อยู่เดิม"] },
        { q: "10. ข้อความ \"Please RSVP by Friday.\" ในบัตรเชิญ หมายถึงอะไร?", options: ["ก. โปรดแต่งกายชุดสุภาพ", "ข. โปรดตอบกลับภายในวันศุกร์", "ค. โปรดนำของขวัญมาด้วย", "ง. งานจะเริ่มในวันศุกร์", "จ. โปรดมาให้ตรงเวลา"], answer: 1, explain: ["ก. ผิด เพราะการแต่งกายใช้คำว่า Dress Code", "เฉลย: ข. ถูก เพราะ RSVP ย่อมาจากภาษาฝรั่งเศส หมายถึง โปรดตอบกลับเพื่อให้ทราบจำนวนผู้มางาน", "ค. ผิด เพราะไม่เกี่ยวข้องกับของขวัญ", "ง. ผิด เพราะเป็นเพียงการกำหนดวันตอบกลับ ไม่ใช่วันจัดงาน", "จ. ผิด เพราะความตรงเวลาใช้คำว่า Punctuality"] }
    ],

    // ============================================
    // 24: การพัฒนาโปรแกรมบนอุปกรณ์พกพาเบื้องต้น (เพิ่มใหม่)
    // ============================================
    "การพัฒนาโปรแกรมบนอุปกรณ์พกพาเบื้องต้น": [
        { q: "1. ข้อใดคือความหมายของ \"อุปกรณ์พกพา\" (Mobile Device) ที่ถูกต้องที่สุด", options: ["ก. อุปกรณ์คอมพิวเตอร์ที่ติดตั้งอยู่กับที่", "ข. อุปกรณ์อิเล็กทรอนิกส์ขนาดเล็กที่สามารถนำติดตัวไปได้สะดวกและมีแหล่งพลังงานในตัว", "ค. เครื่องพิมพ์เอกสารขนาดใหญ่", "ง. ชุดซอฟต์แวร์สำหรับเขียนโปรแกรม", "จ. ระบบเครือข่ายอินเทอร์เน็ตความเร็วสูง"], answer: 1, explain: ["ก. ผิด เพราะคอมพิวเตอร์ตั้งโต๊ะไม่ใช่การใช้งานแบบพกพา", "เฉลย: ข. ถูก เพราะอุปกรณ์พกพาเน้นความคล่องตัว มีแบตเตอรี่ในตัว และใช้งานขณะเคลื่อนที่ได้", "ค. ผิด เพราะเครื่องพิมพ์ไม่ใช่ประเภทของอุปกรณ์พกพาพื้นฐาน", "ง. ผิด เพราะนี่คือความหมายของ IDE ไม่ใช่ตัวอุปกรณ์", "จ. ผิด เพราะเครือข่ายคือส่วนเชื่อมต่อ ไม่ใช่ตัวอุปกรณ์"] },
        { q: "2. ระบบปฏิบัติการมือถือใดที่เป็นระบบ \"Open Source\"", options: ["ก. iOS", "ข. Android", "ค. Windows Phone", "ง. BlackBerry OS", "จ. Symbian"], answer: 1, explain: ["ก. ผิด เพราะเป็นระบบปฏิบัติการแบบปิด (Proprietary) ผู้ใช้ไม่สามารถเข้าถึงหรือแก้ไขซอร์สโค้ดได้", "เฉลย: ข. ถูก เพราะ Android พัฒนาบนพื้นฐาน Linux ทำให้นักพัฒนาเข้าถึงโค้ดต้นฉบับได้", "ค. ผิด เพราะเป็นระบบปฏิบัติการแบบปิดที่ไมโครซอฟท์ควบคุมซอร์สโค้ด", "ง. ผิด เพราะเป็นระบบปฏิบัติการแบบปิด ไม่เปิดให้แก้ไขโค้ดอย่างอิสระ", "จ. ผิด เพราะแม้เคยเปิดบางส่วน แต่โดยสถานะหลักเป็นระบบที่ควบคุมโดยบริษัท ไม่ใช่ Open Source เต็มรูปแบบ"] },
        { q: "3. การพัฒนาแอปพลิเคชันแบบ \"Native App\" มีลักษณะเด่นอย่างไร", options: ["ก. สามารถรันได้ทุกระบบปฏิบัติการโดยเขียนโค้ดชุดเดียว", "ข. มีประสิทธิภาพสูงสุดเนื่องจากเขียนเจาะจงเฉพาะระบบปฏิบัติการนั้นๆ", "ค. ใช้เฉพาะภาษา HTML และ CSS ในการพัฒนา", "ง. ไม่จำเป็นต้องติดตั้งลงในเครื่อง", "จ. ทำงานได้เฉพาะเมื่อเชื่อมต่ออินเทอร์เน็ตเท่านั้น"], answer: 1, explain: ["ก. ผิด เพราะการเขียนโค้ดชุดเดียวรันได้ทุกระบบคือ Hybrid App หรือ Cross-platform", "เฉลย: ข. ถูก เพราะ Native App เข้าถึงความสามารถของฮาร์ดแวร์ได้โดยตรง ทำให้ทำงานได้รวดเร็วและลื่นไหล", "ค. ผิด เพราะ HTML/CSS ใช้สำหรับ Web App", "ง. ผิด เพราะ Native App ต้องติดตั้งผ่าน App Store หรือ Play Store", "จ. ผิด เพราะส่วนใหญ่สามารถทำงานแบบ Offline ได้"] },
        { q: "4. เครื่องมือใดที่นิยมใช้ในการออกแบบ Prototype หรือจำลองหน้าจอแอปพลิเคชัน", options: ["ก. Notepad", "ข. Figma", "ค. Excel", "ง. Winamp", "จ. MySQL"], answer: 1, explain: ["ก. ผิด เพราะใช้เขียนข้อความหรือโค้ดเบื้องต้นเท่านั้น", "เฉลย: ข. ถูก เพราะ Figma เป็นเครื่องมือออกแบบ UI/UX ที่ทันสมัยและรองรับการทำงานร่วมกันออนไลน์", "ค. ผิด เพราะใช้สำหรับตารางงาน", "ง. ผิด เพราะเป็นโปรแกรมฟังเพลง", "จ. ผิด เพราะเป็นระบบจัดการฐานข้อมูล"] },
        { q: "5. \"User Interface (UI)\" หมายถึงส่วนใดของแอปพลิเคชัน", options: ["ก. ส่วนที่ใช้จัดการฐานข้อมูล", "ข. ส่วนการคำนวณตรรกะเบื้องหลัง", "ค. ส่วนที่ผู้ใช้งานมองเห็นและมีปฏิสัมพันธ์ด้วย", "ง. ส่วนที่เชื่อมต่อกับอินเทอร์เน็ต", "จ. ส่วนของการเข้ารหัสลับข้อมูล"], answer: 2, explain: ["ก. ผิด เพราะเป็นงานของระบบหลังบ้าน (Backend) ไม่ใช่ส่วนติดต่อผู้ใช้", "ข. ผิด เพราะเป็นส่วนของ Logic ของโปรแกรม ไม่ใช่ UI", "เฉลย: ค. ถูก เพราะ UI ครอบคลุมถึงหน้าจอ ปุ่ม ตัวอักษร และสีสันที่ผู้ใช้มองเห็น", "ง. ผิด เพราะเป็นหน้าที่ของระบบเครือข่าย (Networking)", "จ. ผิด เพราะเป็นเรื่องของความปลอดภัยของข้อมูล ไม่ใช่ส่วนติดต่อผู้ใช้"] },
        { q: "6. กระบวนการ \"Testing\" แอปพลิเคชันมีจุดประสงค์หลักเพื่ออะไร", options: ["ก. เพื่อให้แอปพลิเคชันมีสีสันสวยงามขึ้น", "ข. เพื่อตรวจสอบหาข้อผิดพลาด (Bugs) และแก้ไขก่อนเปิดใช้งานจริง", "ค. เพื่อให้สามารถตั้งราคาขายแอปพลิเคชันได้แพงขึ้น", "ง. เพื่อลบฐานข้อมูลทิ้งทั้งหมด", "จ. เพื่อเปลี่ยนภาษาโปรแกรมใหม่"], answer: 1, explain: ["ก. ผิด เพราะเป็นเรื่องของการออกแบบ (Design)", "เฉลย: ข. ถูก เพราะการทดสอบช่วยยืนยันคุณภาพและความถูกต้องของแอปพลิเคชัน", "ค. ผิด เพราะเป็นเรื่องของการตลาด (Marketing)", "ง. ผิด เพราะไม่ใช่จุดประสงค์ของการทดสอบ", "จ. ผิด เพราะเป็นเรื่องของการพัฒนา (Development)"] },
        { q: "7. การออกแบบแอปพลิเคชันตามหลัก \"Responsive Design\" คือข้อใด", options: ["ก. การออกแบบให้หน้าจอแอปปรับขนาดตามขนาดหน้าจอของอุปกรณ์ต่างๆ", "ข. การออกแบบให้แอปตอบโต้ด้วยเสียงเท่านั้น", "ค. การออกแบบให้แอปทำงานได้เฉพาะหน้าจอแนวตั้ง", "ง. การออกแบบให้แอปใช้พลังงานแบตเตอรี่น้อยที่สุด", "จ. การออกแบบให้แอปพิมพ์เอกสารได้รวดเร็ว"], answer: 0, explain: ["เฉลย: ก. ถูก เพราะเพื่อให้ผู้ใช้งานได้รับประสบการณ์ที่ดีที่สุดไม่ว่าจะใช้มือถือขนาดเล็กหรือแท็บเล็ตขนาดใหญ่", "ข. ผิด เพราะนี่คือ Voice Interface", "ค. ผิด เพราะ Responsive ต้องรองรับได้ทั้งแนวตั้งและแนวนอน", "ง. ผิด เพราะนี่คือการ Optimize พลังงาน", "จ. ผิด เพราะไม่เกี่ยวข้องกับความหมายของการจัดเลย์เอาต์"] },
        { q: "8. \"IDE\" ที่ใช้สำหรับพัฒนาแอปพลิเคชัน Android อย่างเป็นทางการคือข้อใด", options: ["ก. Xcode", "ข. Visual Studio Code", "ค. Android Studio", "ง. Adobe Dreamweaver", "จ. PyCharm"], answer: 2, explain: ["ก. ผิด เพราะ Xcode ใช้สำหรับพัฒนา iOS", "ข. ผิด เพราะเป็น Editor อเนกประสงค์แต่ไม่ใช่ Official IDE ของ Android โดยตรง", "เฉลย: ค. ถูก เพราะ Google กำหนดให้ Android Studio เป็นเครื่องมือหลักในการพัฒนา Android", "ง. ผิด เพราะใช้สำหรับเขียนเว็บ", "จ. ผิด เพราะเน้นพัฒนาภาษา Python"] },
        { q: "9. นามสกุลไฟล์ใดที่ใช้ในการติดตั้งแอปพลิเคชันบนระบบ Android", options: ["ก. .exe", "ข. .dmg", "ค. .apk", "ง. .ipa", "จ. .zip"], answer: 2, explain: ["ก. ผิด เพราะเป็นไฟล์ติดตั้งของ Windows", "ข. ผิด เพราะเป็นไฟล์ติดตั้งของ macOS", "เฉลย: ค. ถูก เพราะ APK (Android Package Kit) เป็นไฟล์รวมไฟล์ติดตั้งทั้งหมดของ Android", "ง. ผิด เพราะเป็นไฟล์ติดตั้งของ iOS", "จ. ผิด เพราะเป็นไฟล์บีบอัดข้อมูลทั่วไป"] },
        { q: "10. การเผยแพร่แอปพลิเคชัน Android สู่สาธารณะ ต้องทำผ่านช่องทางใดเป็นหลัก", options: ["ก. App Store", "ข. Google Play Store", "ค. Steam", "ง. Facebook Marketplace", "จ. YouTube"], answer: 1, explain: ["ก. ผิด เพราะเป็นตลาดกลางสำหรับ iOS", "เฉลย: ข. ถูก เพราะเป็นตลาดกลางหลักสำหรับแอปพลิเคชัน Android", "ค. ผิด เพราะเน้นจำหน่ายเกมคอมพิวเตอร์", "ง. ผิด เพราะเป็นช่องทางซื้อขายสินค้า ไม่ใช่แพลตฟอร์มติดตั้งแอป", "จ. ผิด เพราะเป็นแพลตฟอร์มวิดีโอ ไม่ใช่ตลาดกลางสำหรับแอปพลิเคชัน"] }

    // --------------------------------------------
    // 25: จริยธรรมและกฎหมายคอมพิวเตอร์ (เพิ่มใหม่)
    // --------------------------------------------
    "จริยธรรมและกฎหมายคอมพิวเตอร์": [
        { q: "1. \"จรรยาบรรณวิชาชีพคอมพิวเตอร์\" มีวัตถุประสงค์หลักเพื่ออะไร", options: ["ก. เพื่อกำหนดบทลงโทษจำคุกให้ชัดเจน", "ข. เพื่อเพิ่มรายได้ให้แก่คนทำงานคอมพิวเตอร์", "ค. เพื่อเป็นแนวทางปฏิบัติที่ถูกต้องดีงามในการประกอบอาชีพ", "ง. เพื่อผูกขาดการทำงานคอมพิวเตอร์ไว้เพียงกลุ่มเดียว", "จ. เพื่อป้องกันการนำเข้าสินค้าไอทีจากต่างประเทศ"], answer: 2, explain: ["ก. ผิด เพราะการลงโทษจำคุกเป็นเรื่องของกฎหมาย ไม่ใช่จรรยาบรรณ", "ข. ผิด เพราะรายได้ขึ้นอยู่กับทักษะและการจ้างงาน ไม่ใช่วัตถุประสงค์หลักของจรรยาบรรณ", "เฉลย: ค. ถูก เพราะจรรยาบรรณเป็นมาตรฐานความประพฤติที่สร้างความน่าเชื่อถือและส่งเสริมคุณธรรมในอาชีพ", "ง. ผิด เพราะจรรยาบรรณส่งเสริมความเป็นธรรม ไม่ใช่การผูกขาด", "จ. ผิด เพราะไม่เกี่ยวข้องกับนโยบายนำเข้าสินค้า"] },
        { q: "2. การกระทำในข้อใดถือว่าผิดจริยธรรมคอมพิวเตอร์ด้าน Accuracy (ความถูกต้อง)", options: ["ก. การแอบดูอีเมลเพื่อน", "ข. การลงข้อมูลที่เป็นเท็จลงในฐานข้อมูล", "ค. การคัดลอกโปรแกรมที่มีลิขสิทธิ์", "ง. การจำกัดสิทธิเข้าถึงข้อมูลของผู้ใช้งาน", "จ. การนำคอมพิวเตอร์ไปใช้ในที่ทำงานเพื่อเล่นเกม"], answer: 1, explain: ["ก. ผิด เพราะเป็นการละเมิดความเป็นส่วนตัว (Privacy)", "เฉลย: ข. ถูก เพราะ Accuracy เน้นความถูกต้องแม่นยำของข้อมูลและการนำเสนอข้อมูลจริง", "ค. ผิด เพราะเป็นการละเมิดสิทธิในทรัพย์สิน (Property)", "ง. ผิด เพราะเป็นเรื่องของสิทธิการเข้าถึง (Accessibility)", "จ. ผิด เพราะเป็นการใช้ทรัพยากรผิดวัตถุประสงค์"] },
        { q: "3. การ \"ปล่อยไวรัส\" เพื่อทำลายข้อมูลคอมพิวเตอร์ของผู้อื่น ผิด พ.ร.บ. คอมพิวเตอร์ มาตราใด", options: ["ก. มาตรา 5 (เข้าถึงระบบโดยมิชอบ)", "ข. มาตรา 7 (เข้าถึงข้อมูลโดยมิชอบ)", "ค. มาตรา 9 (ทำให้เสียหาย ทำลาย แก้ไข เปลี่ยนแปลงข้อมูลโดยมิชอบ)", "ง. มาตรา 14 (นำเข้าข้อมูลปลอม)", "จ. มาตรา 16 (ตัดต่อภาพ)"], answer: 2, explain: ["ก. ผิด เพราะเป็นความผิดเรื่องการบุกรุกเข้า “ระบบคอมพิวเตอร์” ไม่ได้เกี่ยวกับการทำลายข้อมูล", "ข. ผิด เพราะเป็นความผิดเรื่องการแอบดูหรือคัดลอก “ข้อมูล” แต่ยังไม่เกิดการทำลายหรือแก้ไขข้อมูล", "เฉลย: ค. ถูก เพราะมาตรา 9 มุ่งเน้นความเสียหายที่เกิดกับ \"ข้อมูล\" เช่น การลบหรือแก้ไขด้วยไวรัส", "ง. ผิด เพราะเกี่ยวกับการเผยแพร่ข้อมูลปลอม ข้อมูลเท็จ หรือข้อมูลลามก ไม่ใช่การทำลายข้อมูล", "จ. ผิด เพราะเป็นความผิดเกี่ยวกับการตัดต่อหรือเผยแพร่ภาพเพื่อทำให้ผู้อื่นเสียหาย ไม่เกี่ยวกับไวรัสหรือข้อมูลคอมพิวเตอร์"] },
        { q: "4. กฎหมาย \"ลิขสิทธิ์\" คุ้มครองผลงานประเภทใด", options: ["ก. วิธีการทำส้มตำให้อร่อย", "ข. โปรแกรมคอมพิวเตอร์และงานวรรณกรรม", "ค. ชื่อทางการค้าของบริษัท", "ง. การประดิษฐ์เครื่องยนต์พลังงานน้ำ", "จ. ข่าวประจำวันทั่วไป"], answer: 1, explain: ["ก. ผิด เพราะวิธีการหรือแนวคิด (Idea) ไม่ได้รับความคุ้มครอง ต้องสื่อออกมาเป็นงานสร้างสรรค์", "เฉลย: ข. ถูก เพราะโปรแกรมคอมพิวเตอร์จัดเป็น \"งานวรรณกรรม\" ภายใต้กฎหมายลิขสิทธิ์", "ค. ผิด เพราะได้รับความคุ้มครองภายใต้กฎหมาย \"เครื่องหมายการค้า\"", "ง. ผิด เพราะได้รับความคุ้มครองภายใต้กฎหมาย \"สิทธิบัตร\"", "จ. ผิด เพราะข่าวประจำวันหรือข้อเท็จจริงไม่ถือเป็นงานมีลิขสิทธิ์"] },
        { q: "5. อายุการคุ้มครองลิขสิทธิ์ในงานทั่วไป (เช่น เพลง ภาพถ่าย) มีระยะเวลานานเท่าใด", options: ["ก. 10 ปี", "ข. 20 ปี", "ค. ตลอดอายุผู้สร้างสรรค์ และมีต่อไปอีก 50 ปี หลังเสียชีวิต", "ง. ตลอดกาลไม่มีวันหมดอายุ", "จ. 1 ปี และต้องต่ออายุทุกปี"], answer: 2, explain: ["ก. ผิด เพราะเป็นระยะเวลาคุ้มครองของสิทธิบัตรการออกแบบ ไม่ใช่ลิขสิทธิ์", "ข. ผิด เพราะเป็นระยะเวลาคุ้มครองของสิทธิบัตรการประดิษฐ์ ไม่ใช่ลิขสิทธิ์", "เฉลย: ค. ถูก เพราะเป็นมาตรฐานสากลและกฎหมายไทยเพื่อให้ผู้สร้างสรรค์และทายาทได้รับประโยชน์", "ง. ผิด เพราะเมื่อลิขสิทธิ์สิ้นสุด งานจะตกเป็นสมบัติสาธารณะ (Public Domain)", "จ. ผิด เพราะลิขสิทธิ์เกิดขึ้นอัตโนมัติเมื่อสร้างสรรค์ผลงาน ไม่ต้องจดทะเบียนหรือต่ออายุ"] },
        { q: "6. \"สิทธิบัตร\" (Patent) แตกต่างจาก \"ลิขสิทธิ์\" อย่างไร", options: ["ก. สิทธิบัตรไม่ต้องจดทะเบียน แต่ลิขสิทธิ์ต้องจด", "ข. สิทธิบัตรคุ้มครองความสวยงามอย่างเดียว ลิขสิทธิ์คุ้มครองการใช้งาน", "ค. สิทธิบัตรคุ้มครองการประดิษฐ์ที่ใหม่และมีขั้นตอนการคิดขั้นสูง ลิขสิทธิ์คุ้มครองงานศิลปะสร้างสรรค์", "ง. สิทธิบัตรมีอายุนานกว่าลิขสิทธิ์", "จ. สิทธิบัตรคุ้มครองเฉพาะโปรแกรมคอมพิวเตอร์เท่านั้น"], answer: 2, explain: ["ก. ผิด เพราะสิทธิบัตร \"ต้อง\" จดทะเบียนจึงจะคุ้มครอง แต่ลิขสิทธิ์ไม่ต้องจด", "ข. ผิด เพราะสิทธิบัตรคุ้มครองทั้งการประดิษฐ์และการออกแบบผลิตภัณฑ์", "เฉลย: ค. ถูก เพราะสิทธิบัตรเน้นสิ่งประดิษฐ์และกรรมวิธี ส่วนลิขสิทธิ์เน้นความนึกคิดที่ถ่ายทอดออกมา", "ง. ผิด เพราะลิขสิทธิ์มีอายุคุ้มครองนานกว่า (ตลอดชีพ+50ปี) ขณะที่สิทธิบัตรประดิษฐ์มีแค่ 20 ปี", "จ. ผิด เพราะในไทยโปรแกรมคอมพิวเตอร์คุ้มครองด้วยลิขสิทธิ์ ไม่ใช่สิทธิบัตร"] },
        { q: "7. สัญญาอนุญาตแบบ Creative Commons (CC) ที่มีสัญลักษณ์ \"BY\" หมายความว่าอย่างไร", options: ["ก. ห้ามนำไปใช้เพื่อการค้า", "ข. ต้องระบุที่มาของผลงาน (ให้เครดิต)", "ค. ห้ามแก้ไขดัดแปลงผลงาน", "ง. ต้องใช้สัญญาอนุญาตแบบเดียวกันต่อๆ ไป", "จ. ใครจะนำไปใช้ทำอะไรก็ได้โดยไม่ต้องบอก"], answer: 1, explain: ["ก. ผิด เพราะห้ามใช้เพื่อการค้าคือสัญลักษณ์ NC (Non-Commercial)", "เฉลย: ข. ถูก เพราะ Attribution (BY) คือเงื่อนไขพื้นฐานที่ต้องระบุเจ้าของผลงานเสมอ", "ค. ผิด เพราะห้ามดัดแปลงคือสัญลักษณ์ ND (No Derivatives)", "ง. ผิด เพราะแชร์แบบเดียวกันคือสัญลักษณ์ SA (Share Alike)", "จ. ผิด เพราะ CC มีเงื่อนไขการใช้ ไม่ใช่สัญญาอนุญาตแบบอิสระ 100%"] },
        { q: "8. พนักงานคอมพิวเตอร์นำข้อมูลความลับทางการค้าของบริษัทไปขายให้คู่แข่ง ถือเป็นการผิดจริยธรรมด้านใด", options: ["ก. Privacy (ความเป็นส่วนตัว)", "ข. Accuracy (ความถูกต้อง)", "ค. Property (ทรัพย์สิน)", "ง. Accessibility (สิทธิการเข้าถึง)", "จ. ความผิดด้านการจราจรทางบก"], answer: 2, explain: ["ก. ผิด เพราะข้อมูลบริษัทไม่ใช่ข้อมูลส่วนบุคคล (Privacy) ของพนักงาน", "ข. ผิด เพราะข้อมูลอาจจะเป็นจริง แต่การนำไปใช้คือการลักขโมย", "เฉลย: ค. ถูก เพราะข้อมูลความลับทางการค้าถือเป็นทรัพย์สินทางปัญญาขององค์กร", "ง. ผิด เพราะพนักงานอาจมีสิทธิเข้าถึง แต่ไม่มีสิทธิครอบครองเพื่อการขาย", "จ. ผิด เพราะไม่เกี่ยวข้องกับกฎหมายจราจร"] },
        { q: "9. \"Cyberbullying\" หรือการกลั่นแกล้งทางออนไลน์ สอดคล้องกับความผิดในมาตราใดมากที่สุดหากมีการดัดแปลงรูปภาพ", options: ["ก. มาตรา 5", "ข. มาตรา 9", "ค. มาตรา 16", "ง. มาตรา 20", "จ. มาตรา 10"], answer: 2, explain: ["ก. ผิด เพราะเป็นการแฮกระบบ", "ข. ผิด เพราะเป็นการทำลายข้อมูล", "เฉลย: ค. ถูก เพราะมาตรา 16 ว่าด้วยการนำภาพที่เกิดจากการสร้างขึ้น ตัดต่อ ดัดแปลง มาเผยแพร่ทำให้ผู้อื่นเสียชื่อเสียง", "ง. ผิด เพราะเป็นเรื่องการปิดกั้นเว็บไซต์", "จ. ผิด เพราะเป็นการก่อกวนการทำงานของระบบคอมพิวเตอร์"] },
        { q: "10. การละเมิดลิขสิทธิ์โดยการ \"ทำซ้ำ\" (Copy) โปรแกรมคอมพิวเตอร์เพื่อการค้า มีโทษอย่างไร", options: ["ก. ปรับไม่เกิน 1,000 บาท", "ข. จำคุกตั้งแต่ 6 เดือน ถึง 4 ปี หรือปรับตั้งแต่ 100,000 บาท ถึง 800,000 บาท หรือทั้งจำทั้งปรับ", "ค. บริการสังคม 100 ชั่วโมง", "ง. ยึดทรัพย์สินทั้งหมดของญาติพี่น้อง", "จ. ไม่มีโทษถ้าทำในโรงเรียน"], answer: 1, explain: ["ก. ผิด เพราะอัตราโทษเบาเกินไปสำหรับการทำผิดเพื่อการค้า", "เฉลย: ข. ถูก เพราะกฎหมายลิขสิทธิ์กำหนดโทษหนักขึ้นหากกระทำเพื่อประโยชน์ทางการค้า", "ค. ผิด เพราะโทษอาญาหลักคือจำคุกและปรับ", "ง. ผิด เพราะการลงโทษจำกัดเฉพาะผู้กระทำผิด ไม่ลามไปถึงญาติพี่น้อง", "จ. ผิด เพราะการใช้ในสถานศึกษามีข้อยกเว้นบางประการ แต่ถ้าเป็นการ \"ทำซ้ำเพื่อการค้า\" ยังคงมีความผิด"] }
    ],

    // ============================================
    // 26: ธุรกิจและการเป็นผู้ประกอบการ (เพิ่มใหม่)
    // ============================================
    "ธุรกิจและการเป็นผู้ประกอบการ": [
        { q: "1. การวางแผนเป้าหมายชีวิตโดยใช้ \"วงจร PDCA\" ขั้นตอนใดคือการตรวจสอบผลการดำเนินงานกับเป้าหมาย", options: ["ก. Plan (วางแผน)", "ข. Do (ปฏิบัติ)", "ค. Check (ตรวจสอบ)", "ง. Act (ปรับปรุงแก้ไข)", "จ. Control (ควบคุม)"], answer: 2, explain: ["ก. ผิด เพราะ Plan คือการกำหนดเป้าหมายและวิธีทำงาน", "ข. ผิด เพราะ Do คือการลงมือทำตามแผน", "เฉลย: ค. ถูก เพราะ Check คือการตรวจสอบ ประเมินผลว่าสิ่งที่ทำตรงกับแผนหรือไม่", "ง. ผิด เพราะ Act คือการนำผลประเมินมาปรับปรุงให้ดีขึ้น", "จ. ผิด เพราะ Control เป็นความหมายโดยรวมแต่ไม่ใช่ตัวย่อในวงจร PDCA"] },
        { q: "2. ข้อใดคือความหมายที่ถูกต้องที่สุดของ \"การเป็นผู้ประกอบการ\"", options: ["ก. การรับจ้างทำงานในบริษัทใหญ่", "ข. การคิดค้นและเริ่มดำเนินธุรกิจเพื่อสร้างมูลค่าโดยยอมรับความเสี่ยง", "ค. การมีรายได้เสริมจากการทำงานประจำ", "ง. การลงทุนในตลาดหลักทรัพย์เพียงอย่างเดียว", "จ. การขอรับสวัสดิการจากรัฐบาล"], answer: 1, explain: ["ก. ผิด เพราะนั่นคือลักษณะของลูกจ้าง", "เฉลย: ข. ถูก เพราะผู้ประกอบการต้องมีความริเริ่มสร้างสรรค์และพร้อมแบกรับความเสี่ยงทางการเงิน", "ค. ผิด เพราะอาจเป็นเพียงรายได้เสริม ไม่ใช่การบริหารธุรกิจเต็มรูปแบบ", "ง. ผิด เพราะเป็นการลงทุน (Investor) ไม่ใช่การบริหารจัดการธุรกิจ", "จ. ผิด เพราะไม่เกี่ยวข้องกับการสร้างมูลค่าทางธุรกิจ"] },
        { q: "3. หลักปรัชญาของเศรษฐกิจพอเพียง \"3 ห่วง 2 เงื่อนไข\" ข้อใดคือเงื่อนไขสำคัญที่ต้องมีคู่กัน", options: ["ก. ความพอประมาณ - มีเหตุผล", "ข. มีเหตุผล - มีภูมิคุ้มกัน", "ค. ความรู้ – คุณธรรม", "ง. ประหยัด - อดทน", "จ. ซื่อสัตย์ – กตัญญู"], answer: 2, explain: ["ก. ผิด เพราะ \"ความพอประมาณ\" และ \"ความมีเหตุผล\" จัดอยู่ในองค์ประกอบ \"3 ห่วง\" (ทางสายกลาง) ไม่ใช่เงื่อนไข", "ข. ผิด เพราะทั้งสองข้อจัดอยู่ในองค์ประกอบ \"3 ห่วง\" เช่นเดียวกัน", "เฉลย: ค. ถูก เพราะโครงสร้างปรัชญาเศรษฐกิจพอเพียงระบุฐานรากสำคัญไว้ 2 ด้าน คือ \"เงื่อนไขความรู้\" (รอบรู้ รอบคอบ ระมัดระวัง) และ \"เงื่อนไขคุณธรรม\" (ซื่อสัตย์ สุจริต ขยัน อดทน)", "ง. ผิด เพราะเป็นเพียงแนวปฏิบัติหรือคุณธรรมประกอบ ไม่ใช่ชื่อเรียกหลักของ \"2 เงื่อนไข\" ตามทฤษฎี", "จ. ผิด เพราะเป็นคุณธรรมย่อยที่ควรพึงมี แต่ไม่ใช่ชื่อหัวข้อหลักของเงื่อนไขตามโครงสร้างโมเดล"] },
        { q: "4. การวิเคราะห์ SWOT ข้อใดถือเป็น “ปัจจัยภายใน” ของธุรกิจ", options: ["ก. โอกาส (Opportunities)", "ข. อุปสรรค (Threats)", "ค. จุดแข็ง (Strengths) และ จุดอ่อน (Weaknesses)", "ง. นโยบายรัฐบาล", "จ. สภาพเศรษฐกิจโลก"], answer: 2, explain: ["ก. ผิด เพราะโอกาสเป็นปัจจัยภายนอกที่ควบคุมไม่ได้", "ข. ผิด เพราะอุปสรรคเป็นปัจจัยภายนอกขององค์กร", "เฉลย: ค. ถูก เพราะจุดแข็งและจุดอ่อนเป็นปัจจัยภายในที่เกิดจากการบริหารและทรัพยากรของธุรกิจ", "ง. ผิด เพราะนโยบายรัฐบาลเป็นปัจจัยภายนอก", "จ. ผิด เพราะสภาพเศรษฐกิจโลกเป็นปัจจัยแวดล้อมภายนอก"] },
        { q: "5. ขั้นตอนแรกของการจัดทำแผนธุรกิจ (Business Plan) คือข้อใด", options: ["ก. การวางแผนการตลาด", "ข. การเขียนบทสรุปผู้บริหาร", "ค. การวิเคราะห์โครงสร้างองค์กร", "ง. การกำหนดวิสัยทัศน์และพันธกิจ", "จ. การหาแหล่งเงินทุน"], answer: 3, explain: ["ก. ผิด เพราะเป็นขั้นตอนที่ดำเนินการหลังจากกำหนดทิศทางธุรกิจแล้ว", "ข. ผิด เพราะบทสรุปผู้บริหารจัดทำเป็นขั้นตอนสุดท้าย", "ค. ผิด เพราะโครงสร้างองค์กรเป็นรายละเอียดภายหลังการกำหนดเป้าหมาย", "เฉลย: ง. ถูก เพราะเป็นการกำหนดทิศทางและเป้าหมายหลักของธุรกิจก่อนดำเนินการขั้นอื่น", "จ. ผิด เพราะการหาแหล่งเงินทุนต้องอาศัยแผนธุรกิจที่ชัดเจนก่อน"] },
        { q: "6. ธุรกิจประเภท “เจ้าของคนเดียว” มีข้อเสียเปรียบอย่างไรมากที่สุด", options: ["ก. ตัดสินใจได้รวดเร็ว", "ข. ได้รับกำไรเพียงผู้เดียว", "ค. รับผิดชอบหนี้สินอย่างไม่จำกัด", "ง. เสียภาษีซ้อน", "จ. ขั้นตอนการจดทะเบียนยุ่งยาก"], answer: 2, explain: ["ก. ผิด เพราะเป็นข้อดีของธุรกิจเจ้าของคนเดียว", "ข. ผิด เพราะเป็นข้อดีด้านผลตอบแทน", "เฉลย: ค. ถูก เพราะเจ้าของต้องรับผิดชอบหนี้สินทั้งหมดแม้ใช้ทรัพย์สินส่วนตัว", "ง. ผิด เพราะเสียภาษีเงินได้บุคคลธรรมดา ไม่ใช่ภาษีซ้อน", "จ. ผิด เพราะเป็นรูปแบบธุรกิจที่จดทะเบียนง่ายที่สุด"] },
        { q: "7. การเพิ่มผลผลิต (Productivity) มีเป้าหมายสูงสุดเพื่ออะไร", options: ["ก. การลดจำนวนพนักงานให้เหลือน้อยที่สุด", "ข. การเพิ่มต้นทุนเพื่อสินค้าที่มีคุณภาพ", "ค. การใช้ทรัพยากรอย่างคุ้มค่าเพื่อให้ได้ผลผลิตสูงสุด", "ง. การบังคับให้พนักงานทำงานล่วงเวลา", "จ. การเปลี่ยนเครื่องจักรใหม่ทุกปี"], answer: 2, explain: ["ก. ผิด เพราะอาจทำให้ประสิทธิภาพการทำงานลดลง", "ข. ผิด เพราะการเพิ่มผลผลิตเน้นความคุ้มค่า ไม่ใช่เพิ่มต้นทุน", "เฉลย: ค. ถูก เพราะมุ่งเพิ่มผลลัพธ์ต่อทรัพยากรที่ใช้", "ง. ผิด เพราะอาจกระทบคุณภาพงานและสุขภาพแรงงาน", "จ. ผิด เพราะไม่จำเป็นและสิ้นเปลืองทรัพยากร"] },
        { q: "8. กฎหมายคุ้มครองผู้บริโภคให้สิทธิใดแก่ผู้ซื้อสินค้า", options: ["ก. สิทธิในการเลือกซื้อสินค้าตามความสมัครใจ", "ข. สิทธิในการได้รับข้อมูลข่าวสารที่ถูกต้อง", "ค. สิทธิในการได้รับพิจารณาและชดเชยความเสียหาย", "ง. ถูกทั้ง ก ข และ ค", "จ. สิทธิในการต่อรองราคาได้ตามใจชอบ"], answer: 3, explain: ["ก. ผิด เพราะเป็นเพียงสิทธิด้านการเลือกซื้ออย่างเดียว", "ข. ผิด เพราะเป็นเพียงสิทธิด้านข้อมูลข่าวสาร", "ค. ผิด เพราะเป็นเพียงสิทธิด้านการชดเชยความเสียหาย", "เฉลย: ง. ถูก เพราะรวมสิทธิพื้นฐานที่กฎหมายคุ้มครองผู้บริโภคกำหนดไว้ครบถ้วน", "จ. ผิด เพราะกฎหมายคุ้มครองความเป็นธรรม ไม่ได้ให้สิทธิต่อรองราคาตามใจชอบ"] },
        { q: "9. “เงินออม = รายได้ – รายจ่าย” ตามหลักการจัดการการเงินที่ดี ควรจัดการอย่างไร", options: ["ก. ใช้จ่ายก่อน เหลือเท่าไหร่ค่อยออม", "ข. ออมก่อนใช้จ่าย", "ค. กู้ยืมมาออม", "ง. ไม่ต้องออมถ้ารายได้น้อย", "จ. นำเงินออมไปเล่นการพนัน"], answer: 1, explain: ["ก. ผิด เพราะมักจะไม่มีเงินเหลือให้ออม", "เฉลย: ข. ถูก เพราะการหักเงินออมทันทีที่มีรายได้ช่วยสร้างวินัยและความมั่นคงทางการเงิน", "ค. ผิด เพราะการออมไม่ควรเกิดจากการก่อหนี้", "ง. ผิด เพราะทุกคนสามารถออมได้ตามสัดส่วนรายได้", "จ. ผิด เพราะขัดกับหลักการบริหารเงินที่เน้นความมั่นคง"] },
        { q: "10. ข้อใดคือความหมายของ “จรรยาบรรณธุรกิจ” (Business Ethics)", options: ["ก. การมุ่งเน้นผลกำไรสูงสุดโดยไม่สนใจวิธีการ", "ข. การแข่งขันที่ทำลายคู่แข่งในทุกวิถีทาง", "ค. มาตรฐานความประพฤติที่ถูกต้องดีงามในการดำเนินธุรกิจ", "ง. การเลี่ยงภาษีเพื่อลดต้นทุน", "จ. การจ้างแรงงานผิดกฎหมายเพื่อลดค่าใช้จ่าย"], answer: 2, explain: ["ก. ผิด เพราะเป็นการแสวงหากำไรโดยไม่คำนึงถึงคุณธรรม", "ข. ผิด เพราะเป็นการแข่งขันที่ไม่เป็นธรรม", "เฉลย: ค. ถูก เพราะจรรยาบรรณธุรกิจคือศีลธรรมและคุณธรรมที่ผู้ประกอบการควรปฏิบัติต่อผู้มีส่วนได้ส่วนเสีย", "ง. ผิด เพราะเป็นการกระทำที่ผิดกฎหมาย", "จ. ผิด เพราะเป็นการละเมิดสิทธิแรงงานและผิดกฎหมาย"] }
    ],

    // ============================================
    // 27: โปรแกรมกราฟิก (เพิ่มใหม่)
    // ============================================
    "โปรแกรมกราฟิก": [
        { q: "1. ข้อใดคือความหมายของภาพกราฟิกแบบ \"Bitmap\" ที่ถูกต้องที่สุด", options: ["ก. ภาพที่เกิดจากการคำนวณทางคณิตศาสตร์", "ข. ภาพที่เกิดจากการเรียงตัวกันของจุดสีเล็กๆ ที่เรียกว่า พิกเซล (Pixel)", "ค. ภาพที่ไม่ว่าจะขยายใหญ่เท่าใดภาพก็จะไม่แตก", "ง. ภาพที่มีนามสกุลไฟล์เป็น .AI หรือ .EPS เท่านั้น", "จ. ภาพที่สร้างจากลายเส้นและรูปทรงเรขาคณิต"], answer: 1, explain: ["ก. ผิด เพราะเป็นลักษณะของภาพ Vector", "เฉลย: ข. ถูก เพราะ Bitmap หรือ Raster เป็นภาพที่เก็บข้อมูลเป็นจุดสี (Pixel) เรียงต่อกัน", "ค. ผิด เพราะภาพ Bitmap เมื่อขยายเกินขนาดจะสูญเสียความละเอียดทำให้ภาพแตก", "ง. ผิด เพราะนามสกุลเหล่านี้เป็นของ Vector ส่วน Bitmap คือ .JPG, .PNG", "จ. ผิด เพราะเป็นคุณสมบัติหลักของภาพ Vector"] },
        { q: "2. ภาพกราฟิกแบบ \"Vector\" มีข้อดีเด่นชัดในเรื่องใด", options: ["ก. ให้รายละเอียดสีเหมือนภาพถ่ายจริง", "ข. ย่อหรือขยายขนาดภาพแล้วคุณภาพความคมชัดไม่เปลี่ยนแปลง", "ค. มีขนาดไฟล์ใหญ่กว่าภาพ Bitmap เสมอ", "ง. สามารถแก้ไขจุดพิกเซลในภาพได้โดยตรง", "จ. ไม่สามารถนำไปใช้ในงานพิมพ์ขนาดใหญ่ได้"], answer: 1, explain: ["ก. ผิด เพราะ Vector ไม่เหมาะกับภาพที่ต้องการความสมจริงระดับภาพถ่าย (Gradation ซับซ้อน)", "เฉลย: ข. ถูก เพราะ Vector ใช้การคำนวณทางคณิตศาสตร์ในการวาดเส้น จึงคงความคมชัดทุกขนาด", "ค. ผิด เพราะโดยปกติไฟล์ Vector จะมีขนาดเล็กกว่า Bitmap เพราะเก็บแค่สูตรคำนวณ", "ง. ผิด เพราะ Vector ไม่มีพิกเซลให้แก้ไข แต่แก้ไขผ่าน \"จุดแองเคอร์\" (Anchor Point)", "จ. ผิด เพราะ Vector เหมาะมากสำหรับงานพิมพ์ขนาดใหญ่ เช่น ป้ายไวนิล"] },
        { q: "3. ระบบสีแบบ RGB เหมาะสำหรับงานประเภทใดมากที่สุด", options: ["ก. งานสิ่งพิมพ์ที่ต้องส่งโรงพิมพ์", "ข. งานป้ายไวนิลหน้าตึก", "ค. งานสื่อดิจิทัล เว็บไซต์ และการแสดงผลผ่านหน้าจอ", "ง. งานสกรีนเสื้อยืด", "จ. งานแกะสลักด้วยเลเซอร์"], answer: 2, explain: ["ก. ผิด เพราะงานพิมพ์ต้องใช้ระบบสี CMYK", "ข. ผิด เพราะงานป้ายขนาดใหญ่ใช้ระบบสี CMYK เพื่อให้สีตรงกับหมึกพิมพ์", "เฉลย: ค. ถูก เพราะ RGB (Red, Green, Blue) เป็นระบบสีของแสงที่ใช้แสดงผลบนหน้าจออุปกรณ์ไฟฟ้า", "ง. ผิด เพราะงานสกรีนใช้ระบบแม่สีโรงพิมพ์ CMYK หรือสีพิเศษ", "จ. ผิด เพราะงานแกะสลักมักใช้ไฟล์ลายเส้น Vector ไม่เน้นระบบสี RGB"] },
        { q: "4. หากต้องการสร้างโลโก้ (Logo) ที่สามารถนำไปใช้ได้ทุกขนาด ควรใช้โปรแกรมใดจึงจะเหมาะสมที่สุด", options: ["ก. Adobe Photoshop", "ข. Microsoft Paint", "ค. Adobe Illustrator", "ง. Adobe Premiere Pro", "จ. Notepad"], answer: 2, explain: ["ก. ผิด เพราะ Photoshop เน้น Bitmap เมื่อขยายโลโก้ที่สร้างอาจทำให้ภาพแตก", "ข. ผิด เพราะ Paint เป็นโปรแกรมพื้นฐานไม่รองรับเครื่องมือวาด Vector ขั้นสูง", "เฉลย: ค. ถูก เพราะเป็นโปรแกรมสร้างภาพ Vector ซึ่งเหมาะกับการออกแบบโลโก้ที่ต้องการความคมชัดทุกขนาด", "ง. ผิด เพราะเป็นโปรแกรมสำหรับตัดต่อวิดีโอ", "จ. ผิด เพราะเป็นโปรแกรมสำหรับเขียนข้อความ (Text Editor)"] },
        { q: "5. เครื่องมือ \"Magic Wand Tool\" ในโปรแกรมกราฟิกมีหน้าที่หลักอย่างไร", options: ["ก. ใช้สำหรับวาดรูปวงกลม", "ข. ใช้สำหรับเลือกพื้นที่ที่มีสีโทนเดียวกันหรือใกล้เคียงกัน", "ค. ใช้สำหรับลบภาพพื้นหลังทิ้งทั้งหมดโดยอัตโนมัติ", "ง. ใช้สำหรับปรับความสว่างของภาพ", "จ. ใช้สำหรับพิมพ์ตัวอักษร"], answer: 1, explain: ["ก. ผิด เพราะการวาดวงกลมใช้ Ellipse Marquee หรือ Shape Tool", "เฉลย: ข. ถูก เพราะเป็นเครื่องมือเลือกพื้นที่ (Selection) ตามค่าสีที่คลิกเลือก", "ค. ผิด เพราะแม้จะช่วยเลือกเพื่อลบได้ แต่หน้าที่หลักคือการเลือกพื้นที่ ไม่ใช่การลบทิ้งโดยตรง", "ง. ผิด เพราะการปรับความสว่างใช้ Brightness/Contrast หรือ Curves", "จ. ผิด เพราะการพิมพ์ตัวอักษรใช้ Type Tool"] },
        { q: "6. การบันทึกไฟล์ (Save) รูปภาพแบบ \"PNG\" มีจุดเด่นกว่า \"JPG\" ในเรื่องใด", options: ["ก. ไฟล์ PNG มีขนาดเล็กกว่าเสมอ", "ข. PNG สามารถรักษาสภาพความโปร่งใส (Transparency) ของพื้นหลังได้", "ค. PNG เก็บรายละเอียดสีได้มากกว่า JPG หลายเท่า", "ง. PNG ไม่สามารถเปิดใช้งานบนอินเทอร์เน็ตได้", "จ. PNG เป็นไฟล์ประเภท Vector"], answer: 1, explain: ["ก. ผิด เพราะบ่อยครั้งที่ไฟล์ PNG มีขนาดใหญ่กว่า JPG เพราะเก็บข้อมูลแบบไม่สูญเสียความละเอียด", "เฉลย: ข. ถูก เพราะ PNG รองรับ Alpha Channel ทำให้แสดงผลพื้นหลังทะลุ (โปร่งใส) ได้", "ค. ผิด เพราะทั้งคู่เก็บสีได้ 16.7 ล้านสีเท่ากันในโหมดปกติ", "ง. ผิด เพราะ PNG เป็นไฟล์มาตรฐานที่ใช้บนเว็บทั่วไป", "จ. ผิด เพราะ PNG เป็นไฟล์ประเภท Bitmap"] },
        { q: "7. เครื่องมือ \"Pen Tool\" มีความสำคัญอย่างไรในงานกราฟิก", options: ["ก. ใช้สำหรับเขียนข้อความด้วยลายมือ", "ข. ใช้สำหรับระบายสีภาพให้ดูเหมือนสีน้ำ", "ค. ใช้สร้างเส้นพาธ (Path) และรูปทรงที่มีความแม่นยำสูง", "ง. ใช้สำหรับแก้ไขสีของภาพถ่ายให้ดูเก่าลง", "จ. ใช้สำหรับตัดส่วนภาพ (Crop) ให้เล็กลง"], answer: 2, explain: ["ก. ผิด เพราะเขียนลายมือควรใช้ Brush หรือ Pencil Tool", "ข. ผิด เพราะการระบายสีใช้ Brush Tool", "เฉลย: ค. ถูก เพราะ Pen Tool ใช้กำหนดจุดแองเคอร์เพื่อสร้างเส้นโค้งหรือรูปทรงที่อิสระและแม่นยำ", "ง. ผิด เพราะการแก้สีใช้ Adjustment Layer", "จ. ผิด เพราะการตัดส่วนภาพใช้ Crop Tool"] },
        { q: "8. ฟังก์ชัน \"Free Transform\" (Ctrl+T) ใน Photoshop ใช้ทำหน้าที่อะไร", options: ["ก. ปรับสีภาพให้เป็นขาวดำ", "ข. ย่อ ขยาย หมุน หรือบิดรูปทรงของวัตถุ", "ค. ตัดพื้นหลังภาพออกทันที", "ง. เพิ่มความสว่างให้ภาพ", "จ. บันทึกไฟล์งานเป็นไฟล์ใหม่"], answer: 1, explain: ["ก. ผิด เพราะการปรับขาวดำใช้ Desaturate หรือ Black & White", "เฉลย: ข. ถูก เพราะเป็นคำสั่งหลักในการปรับขนาดและสัดส่วนของวัตถุในเลเยอร์", "ค. ผิด เพราะการตัดพื้นหลังต้องใช้เครื่องมือ Selection ร่วมกับคำสั่งลบ", "ง. ผิด เพราะการเพิ่มความสว่างใช้ Adjustment", "จ. ผิด เพราะการบันทึกไฟล์ใช้ Save As"] },
        { q: "9. ในการออกแบบแบนเนอร์โฆษณาออนไลน์ (Facebook Ads) ควรใช้ระบบสีใด", options: ["ก. CMYK", "ข. Lab Color", "ค. Grayscale", "ง. RGB", "จ. Bitmap (1-bit)"], answer: 3, explain: ["ก. ผิด เพราะ CMYK ใช้สำหรับสื่อสิ่งพิมพ์ (กระดาษ)", "ข. ผิด เพราะ Lab Color เป็นระบบสีในทางทฤษฎี ไม่นิยมใช้ในงานโฆษณาทั่วไป", "ค. ผิด เพราะ Grayscale เป็นสีขาวดำ ไม่เหมาะกับการโฆษณาที่ต้องการความดึงดูด", "เฉลย: ง. ถูก เพราะเป็นสื่อโฆษณาที่แสดงผลผ่านหน้าจอสมาร์ทโฟนและคอมพิวเตอร์ ซึ่งใช้ระบบสีแสง RGB", "จ. ผิด เพราะ Bitmap (1-bit) มีแค่ขาวและดำสนิท ไม่ละเอียดพอสำหรับแบนเนอร์"] },
        { q: "10. การทำ \"Clipping Mask\" มีลักษณะการทำงานอย่างไร", options: ["ก. การตัดภาพออกเป็นชิ้นๆ เพื่อทำจิ๊กซอว์", "ข. การนำภาพหนึ่งไปใส่ไว้ภายในรูปทรงหรือตัวอักษรของอีกเลเยอร์หนึ่ง", "ค. การลบขอบภาพให้มีความฟุ้งกระจาย", "ง. การสลับสีระหว่างสีพื้นที่ (Fill) และสีเส้นขอบ (Stroke)", "จ. การล็อคเลเยอร์ไม่ให้ขยับเขยื้อน"], answer: 1, explain: ["ก. ผิด เพราะการตัดภาพเป็นชิ้นใช้คำสั่ง Slice หรือ Split", "เฉลย: ข. ถูก เพราะรูปทรงด้านล่างจะทำหน้าที่เป็น \"หน้าต่าง\" กำหนดขอบเขตการมองเห็นของภาพด้านบน", "ค. ผิด เพราะความฟุ้งใช้ Feather", "ง. ผิด เพราะการสลับสีใช้ปุ่มลูกศรสลับในแถบเครื่องมือ", "จ. ผิด เพราะการล็อคเลเยอร์ใช้คำสั่ง Lock"] }
    ],

    // --------------------------------------------
    // 28: โปรแกรมตารางงาน (เพิ่มใหม่)
    // --------------------------------------------
    "โปรแกรมตารางงาน": [
        { q: "1. ข้อใดคือความหมายที่ถูกต้องที่สุดของเซลล์ (Cell) ในโปรแกรมตารางงาน", options: ["ก. แถวตามแนวนอนทั้งหมด", "ข. คอลัมน์ตามแนวตั้งทั้งหมด", "ค. จุดตัดระหว่างแถวและคอลัมน์", "ง. แถบเครื่องมือสำหรับคำนวณ", "จ. พื้นที่สำหรับสร้างแผนภูมิ"], answer: 2, explain: ["ก. ผิด เพราะแถวเรียกว่า Row", "ข. ผิด เพราะคอลัมน์เรียกว่า Column", "เฉลย: ค. ถูก เพราะเซลล์คือหน่วยย่อยที่สุดที่เกิดจากการตัดกันของ Row และ Column", "ง. ผิด เพราะแถบเครื่องมือเรียกว่า Ribbon หรือ Toolbar", "จ. ผิด เพราะพื้นที่สร้างแผนภูมิคือ Chart Area"] },
        { q: "2. สัญลักษณ์ใดที่ต้องพิมพ์เป็นลำดับแรกเสมอเมื่อต้องการใช้สูตรคำนวณ", options: ["ก. +", "ข. @", "ค. #", "ง. =", "จ. $"], answer: 3, explain: ["ก. ผิด เพราะเครื่องหมายบวกใช้ในการดำเนินการไม่ใช่การระบุว่าจะเริ่มสูตร", "ข. ผิด เพราะ @ ใช้ในฟังก์ชันรุ่นเก่าหรือระบุชื่ออ้างอิง", "ค. ผิด เพราะ # มักแสดงข้อผิดพลาด (Error)", "เฉลย: ง. ถูก เพราะโปรแกรมกำหนดให้เครื่องหมายเท่ากับเป็นตัวระบุจุดเริ่มต้นของสูตรหรือฟังก์ชัน", "จ. ผิด เพราะ $ ใช้สำหรับการตรึงตำแหน่งอ้างอิงเซลล์ (Absolute Reference)"] },
        { q: "3. หากต้องการรวมค่าตัวเลขในเซลล์ A1 ถึง A10 ต้องใช้ฟังก์ชันในข้อใด", options: ["ก. =COUNT(A1:A10)", "ข. =SUM(A1:A10)", "ค. =MAX(A1:A10)", "ง. =AVERAGE(A1:A10)", "จ. =TOTAL(A1:A10)"], answer: 1, explain: ["ก. ผิด เพราะ COUNT ใช้สำหรับนับจำนวนเซลล์ที่มีตัวเลข", "เฉลย: ข. ถูก เพราะ SUM เป็นฟังก์ชันมาตรฐานสำหรับหาผลรวมของข้อมูลตัวเลข", "ค. ผิด เพราะ MAX ใช้สำหรับหาค่าที่มากที่สุด", "ง. ผิด เพราะ AVERAGE ใช้สำหรับหาค่าเฉลี่ย", "จ. ผิด เพราะ TOTAL ไม่ใช่ชื่อฟังก์ชันมาตรฐานใน Excel"] },
        { q: "4. การอ้างอิงเซลล์แบบ $B$5 เรียกว่าการอ้างอิงแบบใด", options: ["ก. แบบสัมพัทธ์ (Relative Reference)", "ข. แบบผสม (Mixed Reference)", "ค. แบบสัมบูรณ์ (Absolute Reference)", "ง. แบบเชื่อมโยง (Link Reference)", "จ. แบบกลุ่มข้อมูล (Range Reference)"], answer: 2, explain: ["ก. ผิด เพราะแบบสัมพัทธ์จะไม่มีเครื่องหมาย $ (เช่น B5)", "ข. ผิด เพราะแบบผสมจะมี $ เพียงตำแหน่งเดียว (เช่น $B5 หรือ B$5)", "เฉลย: ค. ถูก เพราะการใส่ $ หน้าทั้งชื่อคอลัมน์และเลขแถวเป็นการตรึงตำแหน่งคงที่ไว้เสมอ", "ง. ผิด เพราะเป็นการอ้างอิงข้ามชีตหรือข้ามไฟล์", "จ. ผิด เพราะเป็นการระบุช่วงข้อมูล (เช่น A1:B2)"] },
        { q: "5. หากต้องการนับจำนวนพนักงานในคอลัมน์ B เฉพาะผู้ที่มีเพศ \"ชาย\" ต้องใช้ฟังก์ชันใด", options: ["ก. =COUNT(B:B,\"ชาย\")", "ข. =COUNTA(B:B,\"ชาย\")", "ค. =COUNTIF(B:B,\"ชาย\")", "ง. =IF(B:B=\"ชาย\",COUNT)", "จ. =SUMIF(B:B,\"ชาย\")"], answer: 2, explain: ["ก. ผิด เพราะ COUNT นับได้เฉพาะตัวเลขและไม่รับเงื่อนไข", "ข. ผิด เพราะ COUNTA นับเซลล์ที่ไม่ว่างแต่ไม่รับเงื่อนไข", "เฉลย: ค. ถูก เพราะ COUNTIF ใช้สำหรับนับจำนวนเซลล์ตามเงื่อนไขที่ระบุ", "ง. ผิด เพราะรูปแบบการเขียนฟังก์ชันไม่ถูกต้องตามไวยากรณ์", "จ. ผิด เพราะ SUMIF ใช้สำหรับหาผลรวมตามเงื่อนไข ไม่ใช่การนับจำนวน"] },
        { q: "6. นามสกุลไฟล์มาตรฐานของโปรแกรม Microsoft Excel รุ่นปัจจุบันคือข้อใด", options: ["ก. .docx", "ข. .pptx", "ค. .xlsx", "ง. .txt", "จ. .pdf"], answer: 2, explain: ["ก. ผิดเพราะเป็นนามสกุลของ Microsoft Word", "ข. ผิดเพราะเป็นนามสกุลของ Microsoft PowerPoint", "เฉลย: ค. ถูกเพราะเป็นนามสกุลไฟล์ XML Spreadsheet ของ Excel ตั้งแต่เวอร์ชัน 2007 ขึ้นไป", "ง. ผิดเพราะเป็นไฟล์ข้อความธรรมดา (Plain Text)", "จ. ผิดเพราะเป็นรูปแบบไฟล์เอกสารที่แก้ไขยาก (Portable Document Format)"] },

        { q: "1. ข้อใดเป็นตัวอย่างของปฏิกิริยาเคมีที่เกิดขึ้นในร่างกายมนุษย์", options: ["ก. การกรองของเสียที่ไต", "ข. การเคี้ยวอาหารให้ละเอียด", "ค. การย่อยอาหารด้วยเอนไซม์", "ง. การสูบฉีดเลือดของหัวใจ", "จ. การขับเหงื่อระบายความร้อน"], answer: 2, explain: ["ก. ผิด เพราะการกรองเป็นกระบวนการกายภาพ", "ข. ผิด เพราะการเคี้ยวเป็นการย่อยเชิงกล (กายภาพ)", "เฉลย: ค. ถูก เพราะเอนไซม์ทำปฏิกิริยาย่อยสลายโมเลกุลอาหารให้เปลี่ยนเป็นสารใหม่ที่เล็กลง (Chemical Change)", "ง. ผิด เพราะเป็นการทำงานเชิงกลของกล้ามเนื้อ", "จ. ผิด เพราะการระเหยเป็นกระบวนการกายภาพ"] },

        { q: "3. สารใดทำหน้าที่เป็นตัวทำละลาย (Solvent) ได้ดีที่สุดในสิ่งมีชีวิตและธรรมชาติ", options: ["ก. น้ำมัน", "ข. แอลกอฮอล์", "ค. ปรอท", "ง. น้ำ", "จ. ทินเนอร์"], answer: 3, explain: ["ก. ผิด เพราะน้ำมันเป็นสารไม่มีขั้ว ละลายสารได้จำกัด", "ข. ผิด เพราะพบได้น้อยในธรรมชาติและเป็นพิษต่อเซลล์ในความเข้มข้นสูง", "ค. ผิด เพราะเป็นโลหะหนักและเป็นพิษ", "เฉลย: ง. ถูก เพราะน้ำเป็นโมเลกุลมีขั้ว สามารถละลายสารได้หลากหลายชนิด จำเป็นต่อปฏิกิริยาเคมีในสิ่งมีชีวิต", "จ. ผิด เพราะเป็นสารเคมีสังเคราะห์ ไม่ใช่ตัวทำละลายในระบบชีวภาพ"] },
        { q: "4. ข้อดีของพลาสติกชีวภาพ (Bioplastic) คืออะไร", options: ["ก. ย่อยสลายได้ง่ายในธรรมชาติ", "ข. ราคาถูกกว่าพลาสติกทั่วไป", "ค. ทนความร้อนได้สูงที่สุด", "ง. มีความแข็งแรงดุจเหล็กกล้า", "จ. ไม่มีการเผาไหม้"], answer: 0, explain: ["เฉลย: ก. ถูก เพราะผลิตจากวัตถุดิบธรรมชาติและออกแบบโครงสร้างให้จุลินทรีย์ย่อยสลายได้เร็วกว่าพลาสติกสังเคราะห์", "ข. ผิด เพราะปัจจุบันต้นทุนการผลิตยังสูงกว่าพลาสติกปิโตรเลียม", "ค. ผิด เพราะโดยทั่วไปทนความร้อนได้ต่ำกว่าพลาสติกสังเคราะห์บางชนิด", "ง. ผิด เพราะความแข็งแรงยังจำกัดเมื่อเทียบกับวัสดุโครงสร้างหนัก", "จ. ผิด เพราะสามารถติดไฟได้เหมือนอินทรียวัตถุทั่วไป"] },

        { q: "7. การถ่ายโอนความร้อนรูปแบบใดที่ไม่ต้องอาศัยตัวกลาง", options: ["ก. การนำความร้อน", "ข. การพาความร้อน", "ค. การแผ่รังสีความร้อน", "ง. การสั่นพ้อง", "จ. การระเหย"], answer: 2, explain: ["ก. ผิด เพราะการนำความร้อนต้องอาศัยตัวกลางที่เป็นของแข็ง", "ข. ผิด เพราะการพาความร้อนต้องอาศัยตัวกลางที่เป็นของไหล (น้ำ/อากาศ)", "เฉลย: ค. ถูก เพราะการแผ่รังสีส่งผ่านพลังงานในรูปคลื่นแม่เหล็กไฟฟ้า จึงเดินทางผ่านสุญญากาศได้", "ง. ผิด เพราะเป็นปรากฏการณ์ทางเสียงและการสั่นสะเทือน", "จ. ผิด เพราะเป็นการเปลี่ยนสถานะของสสาร"] },

        { q: "6. What should you say when an interviewer asks, \"Could you tell me about yourself?\"", options: ["A. No, I don't want to.", "B. Briefly talk about your background, education, and skills.", "C. Tell them about your favorite food and movies.", "D. Ask them to read your resume themselves.", "E. Cry and say you really need a job."], answer: 1, explain: ["A. ผิด เพราะเป็นการปฏิเสธที่เสียมารยาทและตัดโอกาสตนเอง", "เฉลย: B. ถูก เพราะเป็นการสรุปข้อมูลสำคัญ (Professional summary) ที่เกี่ยวข้องกับตำแหน่งงาน", "C. ผิด เพราะเป็นเรื่องส่วนตัวที่ไม่เกี่ยวข้องกับสมรรถภาพการทำงาน", "D. ผิด เพราะแสดงถึงความเกียจคร้านและไม่ให้เกียรติผู้สัมภาษณ์", "E. ผิด เพราะแสดงอารมณ์ที่ไม่มั่นคงและขาดความเป็นมืออาชีพ"] },
        { q: "7. Which word is a synonym of \"Vacancies\" in a job advertisement?", options: ["A. Full positions", "B. Closed jobs", "C. Open positions", "D. Expired jobs", "E. Reserved jobs"], answer: 2, explain: ["A. ผิด เพราะ Full หมายถึงตำแหน่งเต็มแล้ว", "B. ผิด เพราะ Closed หมายถึงปิดรับสมัครแล้ว", "เฉลย: C. ถูก เพราะ Vacancies หมายถึงตำแหน่งว่าง ซึ่งมีความหมายเดียวกับ Open positions", "D. ผิด เพราะ Expired หมายถึงประกาศหมดอายุ", "E. ผิด เพราะ Reserved หมายถึงตำแหน่งที่ถูกจองไว้แล้ว"] },
        { q: "8. If you are late for a meeting, what is the best thing to say in English?", options: ["A. I'm sorry for being late.", "B. Traffic was bad, not my fault.", "C. Hello, did you start yet?", "D. Forget it, I'm here now.", "E. Why didn't you wait for me?"], answer: 0, explain: ["เฉลย: A. ถูก เพราะเป็นคำกล่าวขอโทษที่สุภาพ แสดงความรับผิดชอบ และเป็นมาตรฐานสากล", "B. ผิด เพราะเป็นการแก้ตัว ซึ่งดูไม่เป็นมืออาชีพ", "C. ผิด เพราะขาดมารยาทในการขอโทษผู้ร่วมประชุม", "D. ผิด เพราะหยาบคายและไม่สำนึกผิด", "E. ผิด เพราะเป็นการโยนความผิดให้ผู้อื่น"] },
        { q: "9. In a business call, if the person is busy, what should you ask?", options: ["A. Why are they busy?", "B. Can I leave a message?", "C. I will call again in 1 second.", "D. Hang up the phone immediately.", "E. Tell them to stop working and talk to you."], answer: 1, explain: ["A. ผิด เพราะเป็นเรื่องส่วนตัวของผู้รับสาย ไม่ควรก้าวก่าย", "เฉลย: B. ถูก เพราะการฝากข้อความ (Leave a message) เป็นมารยาททางธุรกิจเพื่อให้ติดต่อกลับภายหลัง", "C. ผิด เพราะการโทรซ้ำทันทีรบกวนผู้อื่น", "D. ผิด เพราะการวางสายโดยไม่พูดจาถือว่าเสียมารยาท", "E. ผิด เพราะเป็นการออกคำสั่งและไม่เกรงใจผู้อื่น"] },
        { q: "10. Which of these is a \"Soft Skill\" highly valued in any career?", options: ["A. Coding", "B. Accounting", "C. Teamwork", "D. Driving a truck", "E. Typing speed"], answer: 2, explain: ["A. ผิด เพราะ Coding เป็น Hard Skill (ทักษะเชิงเทคนิค)", "B. ผิด เพราะ Accounting เป็น Hard Skill (วิชาชีพเฉพาะ)", "เฉลย: C. ถูก เพราะ Teamwork เป็น Soft Skill (ทักษะทางสังคม/อุปนิสัย) ที่ใช้ได้กับทุกอาชีพ", "D. ผิด เพราะการขับรถเป็น Hard Skill", "E. ผิด เพราะความเร็วในการพิมพ์เป็น Hard Skill"] }
    ],

    // --------------------------------------------
    // 38: พลังงาน ทรัพยากรและสิ่งแวดล้อม (เพิ่มใหม่)
    // --------------------------------------------
    "พลังงาน ทรัพยากรและสิ่งแวดล้อม": [
        { q: "1. พลังงานในข้อใดจัดเป็น \"พลังงานสิ้นเปลือง\" (Non-renewable Energy)", options: ["ก. พลังงานลม", "ข. พลังงานชีวมวล", "ค. พลังงานแสงอาทิตย์", "ง. พลังงานก๊าซธรรมชาติ", "จ. พลังงานน้ำ"], answer: 3, explain: ["ก. ผิด เพราะเป็นพลังงานหมุนเวียนที่เกิดจากวัฏจักรธรรมชาติ", "ข. ผิด เพราะผลิตจากวัสดุอินทรีย์ทางการเกษตรซึ่งสามารถปลูกทดแทนได้", "ค. ผิด เพราะเป็นพลังงานจากดวงอาทิตย์ซึ่งใช้ไม่มีวันหมด", "เฉลย: ง. ถูก เพราะเป็นเชื้อเพลิงฟอสซิลที่ใช้เวลาทับถมหลายล้านปี ใช้แล้วหมดไป ไม่สามารถสร้างทดแทนได้ในเวลาสั้น", "จ. ผิด เพราะเป็นพลังงานหมุนเวียนจากวัฏจักรน้ำตามธรรมชาติ"] },
        { q: "2. ข้อใดคือความหมายของ \"สิ่งแวดล้อม\" ที่ถูกต้องที่สุด", options: ["ก. สิ่งที่มนุษย์สร้างขึ้นเพื่ออำนวยความสะดวกเท่านั้น", "ข. เฉพาะสิ่งที่เกิดขึ้นเองตามธรรมชาติเท่านั้น", "ค. ทุกสิ่งทุกอย่างที่อยู่รอบตัวเราทั้งที่มีชีวิตและไม่มีชีวิต", "ง. เฉพาะสิ่งมีชีวิตที่อยู่ในป่าและทะเล", "จ. ทรัพยากรธรรมชาติที่นำมาใช้เป็นพลังงานได้"], answer: 2, explain: ["ก. ผิด เพราะความหมายแคบไป ไม่รวมสิ่งที่เกิดขึ้นเองตามธรรมชาติ", "ข. ผิด เพราะความหมายแคบไป ไม่รวมสิ่งที่มนุษย์สร้างขึ้น", "เฉลย: ค. ถูก เพราะนิยามของสิ่งแวดล้อมครอบคลุมทุกสิ่งที่อยู่รอบตัว ทั้งสิ่งที่ธรรมชาติสร้าง (เช่น ป่าไม้) และมนุษย์สร้าง (เช่น ตึก) รวมถึงสิ่งมีชีวิตและไม่มีชีวิต", "ง. ผิด เพราะความหมายแคบไป ไม่รวมสิ่งไม่มีชีวิตและสิ่งที่อยู่ในเมือง", "จ. ผิด เพราะเป็นเพียงส่วนหนึ่งของสิ่งแวดล้อมประเภททรัพยากร"] },
        { q: "3. ทรัพยากรธรรมชาติประเภท \"ใช้แล้วหมดไป\" (Exhaustible Resources) มีลักษณะตรงกับข้อใด", options: ["ก. ขยะอินทรีย์และมูลสัตว์", "ข. แร่ธาตุและถ่านหิน", "ค. ดินและน้ำ", "ง. สัตว์ป่าและทุ่งหญ้า", "จ. อากาศและแสงแดด"], answer: 1, explain: ["ก. ผิด เพราะเป็นวัสดุเหลือใช้ที่หมุนเวียนกลับมาใช้ประโยชน์ได้", "เฉลย: ข. ถูก เพราะมีปริมาณจำกัดในเปลือกโลก ใช้เวลากำเนิดนานมาก หากนำมาใช้จะหมดไป", "ค. ผิด เพราะเป็นทรัพยากรที่สามารถทดแทนหรือฟื้นฟูได้ (Renewable)", "ง. ผิด เพราะเป็นทรัพยากรที่สามารถเจริญเติบโตและขยายพันธุ์ทดแทนได้", "จ. ผิด เพราะเป็นทรัพยากรที่มีใช้อย่างไม่จำกัด (Inexhaustible)"] },
        { q: "4. ปรากฏการณ์เรือนกระจก (Greenhouse Effect) มีสาเหตุหลักมาจากก๊าซชนิดใด", options: ["ก. ก๊าซไนโตรเจน", "ข. ก๊าซออกซิเจน", "ค. ก๊าซฮีเลียม", "ง. ก๊าซไฮโดรเจน", "จ. ก๊าซคาร์บอนไดออกไซด์"], answer: 4, explain: ["ก. ผิด เพราะเป็นก๊าซที่มีมากที่สุดในอากาศแต่ไม่กักเก็บความร้อน", "ข. ผิด เพราะเป็นก๊าซสำหรับหายใจ ไม่ส่งผลต่อภาวะเรือนกระจก", "ค. ผิด เพราะเป็นก๊าซเฉื่อย ไม่มีผลต่ออุณหภูมิโลก", "ง. ผิด เพราะเป็นก๊าซที่เบาและสลายตัวได้ ไม่ก่อภาวะเรือนกระจกหลัก", "เฉลย: จ. ถูก เพราะมีคุณสมบัติในการดูดซับและกักเก็บรังสีความร้อนไว้ในชั้นบรรยากาศโลก"] },
        { q: "5. การติดตั้งหลอดไฟ LED แทนหลอดไส้แบบเดิม จัดเป็นการอนุรักษ์พลังงานในรูปแบบใด", options: ["ก. การลดปริมาณการใช้แสงสว่าง", "ข. การผลิตพลังงานใช้เอง", "ค. การใช้พลังงานทดแทน", "ง. การเพิ่มประสิทธิภาพการใช้พลังงาน", "จ. การจัดหาแหล่งพลังงานใหม่"], answer: 3, explain: ["ก. ผิด เพราะไม่ได้ลดการใช้งาน หรือปิดไฟ", "ข. ผิด เพราะหลอดไฟเป็นอุปกรณ์ใช้ไฟฟ้า ไม่ใช่เครื่องกำเนิดไฟฟ้า", "ค. ผิด เพราะแหล่งพลังงานไฟฟ้ายังคงมาจากระบบสายส่งเดิม", "เฉลย: ง. ถูก เพราะได้ผลลัพธ์ (แสงสว่าง) เท่าเดิมหรือดีขึ้น แต่ใช้ทรัพยากร (ไฟฟ้า) น้อยลง", "จ. ผิด เพราะเป็นการจัดการที่ปลายทาง (ผู้ใช้) ไม่ใช่การหาแหล่งเชื้อเพลิงใหม่"] },
        { q: "6. การปลูกป่าทดแทนในพื้นที่ที่ถูกทำลาย จัดเป็นทรัพยากรประเภทใด", options: ["ก. ทรัพยากรที่ใช้แล้วหมดไป", "ข. ทรัพยากรที่สามารถสร้างทดแทนขึ้นใหม่ได้ (Renewable)", "ค. ทรัพยากรที่ไม่สามารถใช้ประโยชน์ได้", "ง. ทรัพยากรประเภทพลังงานฟอสซิล", "จ. ทรัพยากรเทียม"], answer: 1, explain: ["ก. ผิด เพราะป่าไม้ฟื้นฟูได้ ต่างจากแร่ธาตุ", "เฉลย: ข. ถูก เพราะป่าไม้เป็นทรัพยากรชีวภาพที่สามารถปลูกและเจริญเติบโตใหม่ได้หากมีการจัดการที่ดี", "ค. ผิด เพราะป่าไม้มีประโยชน์มหาศาล", "ง. ผิด เพราะฟอสซิลใช้เวลาเกิดนานนับล้านปี ปลูกไม่ได้", "จ. ผิด เพราะป่าไม้เป็นทรัพยากรธรรมชาติ"] },
        { q: "7. \"พลังงานชีวมวล\" (Biomass) ได้มาจากแหล่งใด", options: ["ก. ลมและกระแสน้ำ", "ข. แผงโซลาร์เซลล์", "ค. เศษวัสดุเหลือใช้ทางการเกษตร เช่น แกลบ ชานอ้อย", "ง. แร่ยูเรเนียม", "จ. ความร้อนใต้พิภพ"], answer: 2, explain: ["ก. ผิด เพราะเป็นพลังงานจลน์จากปรากฏการณ์ธรรมชาติ", "ข. ผิด เพราะเป็นเทคโนโลยีเปลี่ยนแสงอาทิตย์เป็นไฟฟ้า", "เฉลย: ค. ถูก เพราะชีวมวล คือ สารอินทรีย์ที่เก็บสะสมพลังงานจากธรรมชาติ สามารถนำมาเผาไหม้เป็นเชื้อเพลิงได้", "ง. ผิด เพราะเป็นแร่ธาตุเชื้อเพลิงนิวเคลียร์", "จ. ผิด เพราะเป็นพลังงานความร้อนจากแกนโลก"] },
        { q: "8. กฎหมายแม่บทด้านสิ่งแวดล้อมของประเทศไทยคือข้อใด", options: ["ก. พรบ. ข้อมูลข่าวสารของราชการ", "ข. พรบ. ส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ", "ค. พรบ. คุ้มครองผู้บริโภค", "ง. พรบ. คอมพิวเตอร์", "จ. พรบ. การศึกษาแห่งชาติ"], answer: 1, explain: ["ก. ผิด เพราะเกี่ยวข้องกับสิทธิการรับรู้ข้อมูลข่าวสาร", "เฉลย: ข. ถูก เพราะเป็นกฎหมายหลักที่ให้อำนาจในการกำหนดมาตรฐานและการจัดการสิ่งแวดล้อมของประเทศ", "ค. ผิด เพราะเกี่ยวข้องกับการคุ้มครองสิทธิผู้ซื้อสินค้า", "ง. ผิด เพราะเกี่ยวข้องกับการกระทำผิดทางระบบคอมพิวเตอร์", "จ. ผิด เพราะเกี่ยวข้องกับการปฏิรูปการศึกษา"] },
        { q: "9. พลังงานนิวเคลียร์ จัดเป็นพลังงานประเภทใด", options: ["ก. พลังงานหมุนเวียน", "ข. พลังงานสะอาด 100%", "ค. พลังงานน้ำ", "ง. พลังงานจากพืช", "จ. พลังงานสิ้นเปลือง"], answer: 4, explain: ["ก. ผิด เพราะไม่สามารถสร้างเชื้อเพลิงนิวเคลียร์ทดแทนได้ตามธรรมชาติในเวลาสั้น", "ข. ผิด เพราะมีกากกัมมันตรังสีเป็นของเสียอันตรายที่ต้องกำจัด", "ค. ผิด เพราะใช้น้ำเพียงเพื่อหล่อเย็น ไม่ใช่เชื้อเพลิงหลัก", "ง. ผิด เพราะไม่ได้เกิดจากชีวมวลหรือพืช", "เฉลย: จ. ถูก เพราะแร่ยูเรเนียมที่ใช้เป็นเชื้อเพลิงมีปริมาณจำกัดและใช้แล้วหมดไป"] },
        { q: "10. การนำกระดาษที่ใช้แล้วเพียงหน้าเดียวกลับมาใช้อีกหน้า จัดเป็นหลักการใด", options: ["ก. Recycle", "ข. Repair", "ค. Reuse", "ง. Reduce", "จ. Reject"], answer: 2, explain: ["ก. ผิด เพราะ Recycle ต้องนำไปผ่านกระบวนการหลอมหรือขึ้นรูปใหม่", "ข. ผิด เพราะ Repair คือการซ่อมแซมส่วนที่ชำรุดให้กลับมาใช้ได้", "เฉลย: ค. ถูก เพราะเป็นการ \"ใช้ซ้ำ\" ผลิตภัณฑ์เดิมโดยไม่ผ่านการแปรรูป", "ง. ผิด เพราะ Reduce คือการลดการใช้ตั้งแต่ต้น (เช่น ไม่รับถุงพลาสติก)", "จ. ผิด เพราะ Reject คือการปฏิเสธการใช้สินค้าทำลายสิ่งแวดล้อม"] }
    ],
    
    // --------------------------------------------
    // 37: เครือข่ายคอมพิวเตอร์เบื้องต้น (อัปเดต)
    // --------------------------------------------
    "เครือข่ายคอมพิวเตอร์เบื้องต้น": [
        { q: "1. ข้อใดคือความหมายของระบบเครือข่ายคอมพิวเตอร์ (Computer Network) ที่ถูกต้องที่สุด", options: ["ก. การใช้งานคอมพิวเตอร์เพียงเครื่องเดียวอย่างเต็มประสิทธิภาพ", "ข. การเชื่อมต่อคอมพิวเตอร์ตั้งแต่ 2 เครื่องขึ้นไปเพื่อสื่อสารและใช้ทรัพยากรร่วมกัน", "ค. การนำคอมพิวเตอร์มาวางรวมกันในห้องเดียว", "ง. การซ่อมแซมอุปกรณ์คอมพิวเตอร์ให้สามารถเปิดใช้งานได้", "จ. การติดตั้งโปรแกรมประยุกต์ลงในระบบปฏิบัติการ"], answer: 1, explain: ["ก. ผิด เพราะเป็นการทำงานแบบ Stand-alone ไม่ใช่เครือข่าย", "เฉลย: ข. ถูก เพราะหัวใจของเครือข่ายคือการเชื่อมต่อเพื่อแลกเปลี่ยนข้อมูลและใช้ทรัพยากร (เช่น เครื่องพิมพ์) ร่วมกัน", "ค. ผิด เพราะการวางรวมกันโดยไม่เชื่อมต่อสื่อสารกันไม่นับเป็นระบบเครือข่าย", "ง. ผิด เพราะเป็นงานด้านการบำรุงรักษา (Maintenance)", "จ. ผิด เพราะเป็นการเตรียมความพร้อมซอฟต์แวร์ ไม่ใช่การสร้างเครือข่าย"] },
        { q: "2. เครือข่ายที่เชื่อมต่อคอมพิวเตอร์ภายในอาคารเดียวกันหรือระยะทางใกล้ๆ เรียกว่าอะไร", options: ["ก. WAN (Wide Area Network)", "ข. MAN (Metropolitan Area Network)", "ค. PAN (Personal Area Network)", "ง. LAN (Local Area Network)", "จ. SAN (Storage Area Network)"], answer: 3, explain: ["ก. ผิด เพราะ WAN เป็นเครือข่ายระดับประเทศหรือระดับโลก", "ข. ผิด เพราะ MAN เป็นเครือข่ายระดับเมือง", "ค. ผิด เพราะ PAN เป็นเครือข่ายส่วนบุคคลระยะสั้นมาก (เช่น Bluetooth)", "เฉลย: ง. ถูก เพราะ LAN คือเครือข่ายเฉพาะที่ ใช้เชื่อมต่อในพื้นที่จำกัด เช่น บ้าน หรือสำนักงาน", "จ. ผิด เพราะ SAN ใช้เชื่อมต่ออุปกรณ์เก็บข้อมูลความเร็วสูงในดาต้าเซ็นเตอร์"] },
        { q: "3. Topology แบบใดที่หากสายสัญญาณเส้นหลักขาดจะทำให้ระบบทั้งหมดไม่สามารถสื่อสารกันได้", options: ["ก. แบบ Star", "ข. แบบ Ring", "ค. แบบ Bus", "ง. แบบ Mesh", "จ. แบบ Hybrid"], answer: 2, explain: ["ก. ผิด เพราะหากสายจากโหนดไปฮับขาด จะเสียเฉพาะเครื่องนั้น", "ข. ผิด เพราะหากขาด 1 จุด ข้อมูลอาจวิ่งย้อนกลับหรือหยุดชะงัก แต่ไม่ใช่การพึ่งพาสายหลัก (Backbone)", "เฉลย: ค. ถูก เพราะแบบ Bus ใช้สายแกนหลักเพียงเส้นเดียว (Bus Line) หากขาดจะทำให้สัญญาณไม่สามารถเดินทางได้ทั้งระบบ", "ง. ผิด เพราะมีเส้นทางสำรองมากมาย มีความทนทานสูงที่สุด", "จ. ผิด เพราะเป็นการผสมหลายแบบเข้าด้วยกัน"] },
        { q: "4. อุปกรณ์ใดทำหน้าที่เชื่อมต่อเครือข่ายต่างประเภทกัน (เช่น LAN กับ Internet) และเลือกเส้นทางที่เหมาะสมที่สุด", options: ["ก. Hub", "ข. Switch", "ค. Repeater", "ง. Router", "จ. Bridge"], answer: 3, explain: ["ก. ผิด เพราะฮับเพียงแค่กระจายสัญญาณไปยังทุกพอร์ตโดยไม่ฉลาด", "ข. ผิด เพราะสวิตช์ใช้ส่งข้อมูลภายใน LAN เดียวกันตาม MAC Address", "ค. ผิด เพราะทวนสัญญาณเพื่อเพิ่มระยะทางเท่านั้น", "เฉลย: ง. ถูก เพราะเราท์เตอร์ใช้เชื่อมต่อเครือข่ายต่างเน็ตเวิร์กกันและตัดสินใจเลือกเส้นทาง (Routing) ตาม IP Address", "จ. ผิด เพราะบริดจ์ใช้เชื่อมต่อ LAN สองส่วนเข้าด้วยกัน"] },
        { q: "5. สายสัญญาณประเภท UTP นิยมใช้หัวต่อชนิดใด", options: ["ก. RJ-11", "ข. BNC Connector", "ค. RJ-45", "ง. ST Connector", "จ. LC Connector"], answer: 2, explain: ["ก. ผิด เพราะใช้กับสายโทรศัพท์พื้นฐาน", "ข. ผิด เพราะใช้กับสาย Coaxial ในสมัยก่อน", "เฉลย: ค. ถูก เพราะ RJ-45 เป็นมาตรฐานหัวต่อ 8 เข็มสำหรับสาย LAN (UTP)", "ง. ผิด เพราะเป็นหัวต่อสำหรับสายใยแก้วนำแสง (Fiber Optic)", "จ. ผิด เพราะเป็นหัวต่อสำหรับสายใยแก้วนำแสงขนาดเล็ก"] },
        { q: "6. มาตรฐานการเข้าหัวสาย LAN แบบ EIA/TIA 568B สีแรกคือสีอะไร", options: ["ก. ขาว-เขียว", "ข. ขาว-ส้ม", "ค. ส้ม", "ง. เขียว", "จ. ขาว-น้ำเงิน"], answer: 1, explain: ["ก. ผิด เพราะเป็นสีแรกของมาตรฐาน 568A", "เฉลย: ข. ถูก เพราะมาตรฐาน 568B เริ่มต้นด้วย ขาว-ส้ม, ส้ม, ขาว-เขียว, น้ำเงิน... ตามลำดับ", "ค. ผิด เพราะเป็นสีที่สองของ 568B", "ง. ผิด เพราะเป็นสีที่หกของ 568B", "จ. ผิด เพราะเป็นสีที่สี่ของ 568B"] },
        { q: "7. โปรโตคอล (Protocol) หมายถึงข้อใด", options: ["ก. สายสัญญาณชนิดใหม่ล่าสุด", "ข. อุปกรณ์ที่ใช้รวมสัญญาณคอมพิวเตอร์", "ค. กฎระเบียบหรือข้อตกลงในการสื่อสารระหว่างคอมพิวเตอร์", "ง. โปรแกรมป้องกันไวรัสในเครือข่าย", "จ. ความเร็วในการรับส่งข้อมูล"], answer: 2, explain: ["ก. ผิด เพราะโปรโตคอลเป็นซอฟต์แวร์/กติกาสื่อสาร ไม่ใช่ฮาร์ดแวร์", "ข. ผิด เพราะนั่นคือคำจำกัดความของ Hub/Switch", "เฉลย: ค. ถูก เพราะเป็นชุดของกฎที่ทำให้คอมพิวเตอร์ที่อาจต่างยี่ห้อกันสื่อสารกันเข้าใจ", "ง. ผิด เพราะนั่นคือ Antivirus หรือ Firewall", "จ. ผิด เพราะนั่นคือ Bandwidth"] },
        { q: "8. IP Address รุ่นใดที่ปัจจุบันได้รับความนิยมและประกอบด้วยตัวเลข 4 ชุด (เช่น 192.168.1.1)", options: ["ก. IPv1", "ข. IPv4", "ค. IPv6", "ง. IPv8", "จ. IPv10"], answer: 1, explain: ["ก. ผิด เพราะไม่มีมาตรฐานนี้ใช้งานทั่วไป", "เฉลย: ข. ถูก เพราะ IPv4 มีขนาด 32 บิต แบ่งเป็น 4 ชุด ชุดละ 8 บิต คั่นด้วยจุด เป็นที่นิยมมากที่สุดในปัจจุบัน", "ค. ผิด เพราะเป็นรุ่นใหม่ที่มีตัวเลขยาวกว่า (128 บิต) เพื่อแก้ปัญหาเลขที่อยู่ไม่พอ", "ง. ผิด เพราะไม่มีมาตรฐานนี้", "จ. ผิด เพราะไม่มีมาตรฐานนี้"] },
        { q: "9. อุปกรณ์ใดในปัจจุบันที่ทำงานแทน Hub ได้ดีกว่าเนื่องจากช่วยลดความหนาแน่นของข้อมูล (Collision)", options: ["ก. Router", "ข. Gateway", "ค. Modem", "ง. Switch", "จ. Access Point"], answer: 3, explain: ["ก. ผิด เพราะใช้เชื่อมต่อต่างเครือข่าย ไม่ใช่อุปกรณ์พื้นฐานในการรวมโหนดใน LAN", "ข. ผิด เพราะเป็นจุดเชื่อมต่อระหว่างเครือข่ายที่มีโปรโตคอลต่างกันมาก", "ค. ผิด เพราะแปลงสัญญาณดิจิทัลเป็นอนาล็อก", "เฉลย: ง. ถูก เพราะสวิตช์ส่งข้อมูลเฉพาะพอร์ตที่ต้องการ (Unicast) ทำให้ไม่เกิดการชนกันของข้อมูลเหมือนฮับ", "จ. ผิด เพราะใช้สำหรับเชื่อมต่อไร้สาย"] },
        { q: "10. ชั้นสื่อสารลำดับแรก (ชั้นที่ 1) ของ OSI Model คืออะไร", options: ["ก. Physical Layer", "ข. Data Link Layer", "ค. Network Layer", "ง. Application Layer", "จ. Transport Layer"], answer: 0, explain: ["เฉลย: ก. ถูก เพราะชั้นกายภาพ (Physical) เกี่ยวข้องกับสัญญาณไฟฟ้าและสายสัญญาณ เป็นฐานล่างสุด", "ข. ผิด เพราะเป็นชั้นที่ 2 จัดการเรื่อง MAC Address", "ค. ผิด เพราะเป็นชั้นที่ 3 จัดการเรื่อง IP Address", "ง. ผิด เพราะเป็นชั้นที่ 7 ชั้นบนสุดที่ผู้ใช้โต้ตอบ", "จ. ผิด เพราะเป็นชั้นที่ 4 จัดการเรื่องความถูกต้องของการส่งข้อมูล"] }
    ],

    // --------------------------------------------
    // 38: โปรแกรมนำเสนอ (อัปเดต)
    // --------------------------------------------
    "โปรแกรมนำเสนอ": [
        { q: "1. การออกแบบโครงร่างเรื่องราว (Story board) มีความสำคัญอย่างไรในงานนำเสนอ", options: ["ก. ช่วยให้โปรแกรมทำงานได้เร็วขึ้น", "ข. ช่วยในการจัดลำดับความคิดและเนื้อหาให้เป็นระบบก่อนลงมือทำจริง", "ค. ช่วยเพิ่มจำนวนสไลด์ให้มากขึ้น", "ง. ช่วยประหยัดเนื้อหาที่นำเสนอ", "จ. เป็นการโฆษณาชิ้นงานล่วงหน้า"], answer: 1, explain: ["ก. ผิด เพราะ Storyboard คือแผนผังบนกระดาษ ไม่ส่งผลต่อความเร็วเครื่องคอมพิวเตอร์", "เฉลย: ข. ถูก เพราะเป็นการวางแผนลำดับเหตุการณ์ ภาพ และเสียง เพื่อให้สื่อสารได้ตรงประเด็นและไม่สับสน", "ค. ผิด เพราะวัตถุประสงค์คือความชัดเจน ไม่ใช่การเพิ่มปริมาณสไลด์", "ง. ผิด เพราะไม่ได้ช่วยลดเนื้อหา แต่อาจช่วยคัดกรองเนื้อหาที่ไม่จำเป็นออก", "จ. ผิด เพราะไม่ใช่สื่อโฆษณา แต่เป็นขั้นตอนการผลิต (Production)"] },
        { q: "2. หลักการออกแบบ \"7x7 Rule\" ในสไลด์นำเสนอหมายถึงอะไร", options: ["ก. ใน 1 สไลด์ ควรมี 7 รูปภาพ 7 ข้อความ", "ข. ใน 1 หน้าสไลด์ ไม่ควรมีเกิน 7 บรรทัด และบรรทัดละไม่เกิน 7 คำ", "ค. การนำเสนอควรใช้เวลา 7 นาที ต่อ 7 สไลด์", "ง. ขนาดตัวอักษรต้องเท่ากับ 7 พอยต์", "จ. การเลือกใช้สีไม่ควรเกิน 7 สีในหนึ่งสไลด์"], answer: 1, explain: ["ก. ผิด เพราะการมี 7 รูปในหน้าเดียวจะทำให้สไลด์ดูรกเกินไป", "เฉลย: ข. ถูก เพราะเป็นหลักการสากลที่ช่วยให้ผู้ฟังอ่านเนื้อหาได้ง่ายและไม่ลายตา", "ค. ผิด เพราะระยะเวลาขึ้นอยู่กับเนื้อหา ไม่มีกฎตายตัวขนาดนั้น", "ง. ผิด เพราะ 7 พอยต์ มีขนาดเล็กเกินกว่าที่จะมองเห็นได้ในการนำเสนอ", "จ. ผิด เพราะเป็นกฎที่ไม่มีชื่อเรียกทางการ และการใช้ 7 สีถือว่ามากเกินไป"] },
        { q: "3. ส่วนประกอบใดของโปรแกรมที่ใช้สำหรับดูภาพรวมของสไลด์ทั้งหมดในขนาดเล็ก", options: ["ก. Slide Pane", "ข. Note Pane", "ค. Slide Sorter View", "ง. Title Bar", "จ. Status Bar"], answer: 2, explain: ["ก. ผิด เพราะ Slide Pane คือแถบด้านข้างที่แสดงเรียงลงมาเพื่อเลือกทำงานทีละสไลด์", "ข. ผิด เพราะ Note Pane ใช้สำหรับบันทึกข้อความช่วยจำของผู้บรรยาย", "เฉลย: ค. ถูก เพราะ Slide Sorter View จะแสดงสไลด์เป็นรูปขนาดย่อเรียงกัน ทำให้จัดลำดับหรือย้ายสไลด์ได้ง่าย", "ง. ผิด เพราะ Title Bar แสดงชื่อไฟล์และชื่อโปรแกรม", "จ. ผิด เพราะ Status Bar แสดงสถานะ เช่น จำนวนสไลด์ หรือภาษาที่ใช้"] },
        { q: "4. \"Transition\" หมายถึงข้อใดในโปรแกรมนำเสนอ", options: ["ก. การเคลื่อนไหวของวัตถุภายในสไลด์", "ข. การเปลี่ยนรูปแบบตัวอักษร", "ค. เทคนิคการเปลี่ยนแผ่นสไลด์จากหน้าหนึ่งไปอีกหน้าหนึ่ง", "ง. การแทรกวิดีโอจาก YouTube", "จ. การจัดเก็บไฟล์ในรูปแบบ PDF"], answer: 2, explain: ["ก. ผิด เพราะการเคลื่อนไหววัตถุเรียกว่า Animation", "ข. ผิด เพราะคือการเปลี่ยน Font", "เฉลย: ค. ถูก เพราะ Transition คือเอฟเฟกต์ที่เกิดขึ้นระหว่างการเปลี่ยนหน้าสไลด์ เช่น การเลือนหาย (Fade)", "ง. ผิด เพราะคือการ Insert Multimedia", "จ. ผิด เพราะคือการ Export หรือ Save As"] },
        { q: "5. หากต้องการให้ตัวอักษร \"บินเข้ามา\" ในสไลด์ ต้องใช้คำสั่งใด", options: ["ก. Slide Transition", "ข. Animation", "ค. Design Ideas", "ง. Slide Master", "จ. Hyperlink"], answer: 1, explain: ["ก. ผิด เพราะใช้กับการเปลี่ยนหน้าสไลด์", "เฉลย: ข. ถูก เพราะ Animation ใช้กำหนดการเคลื่อนไหวของวัตถุรายชิ้น (ข้อความ, รูปภาพ, รูปทรง)", "ค. ผิด เพราะเป็นระบบแนะนำการออกแบบอัตโนมัติ", "ง. ผิด เพราะใช้สำหรับกำหนดรูปแบบมาตรฐานของสไลด์ทั้งหมด", "จ. ผิด เพราะใช้สำหรับสร้างจุดเชื่อมโยงไปยังหน้าอื่น"] },
        { q: "6. Slide Master มีประโยชน์อย่างไร", options: ["ก. ใช้สำหรับนำเสนองานผ่านระบบออนไลน์เท่านั้น", "ข. ใช้กำหนดรูปแบบ รูปแบบตัวอักษร และตำแหน่งวัตถุให้เหมือนกันทุกสไลด์อย่างรวดเร็ว", "ค. ใช้สำหรับพิมพ์เอกสารประกอบการบรรยาย", "ง. ใช้สำหรับตรวจคำผิดอัตโนมัติ", "จ. ใช้เพิ่มเอฟเฟกต์เสียงให้กับสไลด์"], answer: 1, explain: ["ก. ผิด เพราะใช้งานได้ทั้งแบบออฟไลน์และออนไลน์", "เฉลย: ข. ถูก เพราะช่วยประหยัดเวลาในการจัดรูปแบบสไลด์ทีละหน้า และทำให้งานนำเสนอมีความเป็นเอกภาพ", "ค. ผิด เพราะการพิมพ์เอกสารคือฟังก์ชัน Handouts", "ง. ผิด เพราะการตรวจคำผิดคือ Spelling Check", "จ. ผิด เพราะการใส่เสียงทำได้ที่เมนู Insert Audio"] },
        { q: "7. นามสกุลไฟล์มาตรฐานของโปรแกรม Microsoft PowerPoint รุ่นปัจจุบันคือข้อใด", options: ["ก. .docx", "ข. .xlsx", "ค. .pptx", "ง. .txt", "จ. .jpg"], answer: 2, explain: ["ก. ผิด เพราะเป็นไฟล์ของ Microsoft Word", "ข. ผิด เพราะเป็นไฟล์ของ Microsoft Excel", "เฉลย: ค. ถูก เพราะ .pptx คือมาตรฐานไฟล์นำเสนอตั้งแต่เวอร์ชัน 2007 เป็นต้นมา", "ง. ผิด เพราะเป็นไฟล์ข้อความธรรมดา (Text)", "จ. ผิด เพราะเป็นไฟล์รูปภาพ"] },
        { q: "8. ปุ่มลัด (Shortcut key) บนคีย์บอร์ดที่ใช้สำหรับเริ่มการนำเสนอ (Slide Show) ตั้งแต่สไลด์แรกคือปุ่มใด", options: ["ก. F1", "ข. F5", "ค. F7", "ง. F12", "จ. Ctrl + S"], answer: 1, explain: ["ก. ผิด เพราะมักใช้เรียกเมนู Help (ความช่วยเหลือ)", "เฉลย: ข. ถูก เพราะเป็นปุ่มมาตรฐานสากลในการสั่งนำเสนอสไลด์ตั้งแต่แผ่นแรก", "ค. ผิด เพราะใช้สำหรับตรวจสอบตัวสะกด (Spelling)", "ง. ผิด เพราะใช้สำหรับ Save As (บันทึกเป็น)", "จ. ผิด เพราะใช้สำหรับ Save (บันทึก)"] },
        { q: "9. ในการนำเสนอผลงานที่ดี ข้อความในสไลด์ควรมีลักษณะอย่างไร", options: ["ก. ใส่เนื้อหาทั้งหมดที่ต้องการพูดลงในสไลด์", "ข. ใช้ตัวอักษรขนาดเล็กเพื่อให้ใส่ข้อมูลได้มากๆ", "ค. สรุปเป็นหัวข้อ (Bullet points) ที่สั้นและกระชับ", "ง. ใช้สีตัวอักษรให้หลากหลายในหนึ่งประโยคเพื่อให้สะดุดตา", "จ. ใช้ตัวอักษรแบบประดิษฐ์ที่อ่านยากเพื่อความสวยงาม"], answer: 2, explain: ["ก. ผิด เพราะจะทำให้ผู้ฟังมัวแต่อ่านสไลด์จนไม่สนใจผู้พูด", "ข. ผิด เพราะผู้รับชมที่อยู่หลังห้องจะมองไม่เห็น", "เฉลย: ค. ถูก เพราะสไลด์ควรทำหน้าที่เป็นสื่อประกอบการพูด ไม่ใช่หนังสือให้อ่าน", "ง. ผิด เพราะทำให้ดูไม่เป็นมืออาชีพและรบกวนสายตา", "จ. ผิด เพราะความสำคัญที่สุดของสไลด์คือ \"การอ่านออกง่าย\""] },
        { q: "10. คำสั่ง \"Hyperlink\" มีหน้าที่หลักคืออะไร", options: ["ก. ทำให้ภาพเคลื่อนไหวได้", "ข. เชื่อมโยงไปยังสไลด์หน้าอื่น เว็บไซต์ภายนอก หรือไฟล์เอกสารอื่นๆ", "ค. ใช้สำหรับลบสไลด์ที่ทับซ้อนกัน", "ง. ใช้เปลี่ยนโทนสีของรูปภาพ", "จ. ใช้บันทึกเสียงบรรยายลงในสไลด์"], answer: 1, explain: ["ก. ผิด เพราะเป็นหน้าที่ของ Animation", "เฉลย: ข. ถูก เพราะสร้างจุดเชื่อมโยงเพื่อความสะดวกในการข้ามไปยังข้อมูลที่เกี่ยวข้อง", "ค. ผิด เพราะการลบสไลด์ใช้ปุ่ม Delete หรือ Backspace", "ง. ผิด เพราะใช้เครื่องมือ Image Format", "จ. ผิด เพราะใช้คำสั่ง Record Audio"] }
    ],

    // --------------------------------------------
    // 39: โปรแกรมสำเร็จรูปทางสถิติ (เพิ่มใหม่)
    // --------------------------------------------
    "โปรแกรมสำเร็จรูปทางสถิติ": [
        { q: "1. ค่าสถิติ \"ฐานนิยม\" (Mode) หมายถึงข้อใด", options: ["ก. ค่าที่อยู่กึ่งกลางของข้อมูลทั้งหมด", "ข. ค่าเฉลี่ยของข้อมูลทั้งหมด", "ค. ค่าของข้อมูลที่มีความถี่ซ้ำกันมากที่สุด", "ง. ผลต่างระหว่างค่าสูงสุดและค่าต่ำสุด", "จ. ค่าที่คำนวณจากการถอดรากที่สอง"], answer: 2, explain: ["ก. ผิด เพราะนี่คือความหมายของ มัธยฐาน (Median)", "ข. ผิด เพราะนี่คือความหมายของ ค่าเฉลี่ยเลขคณิต (Mean)", "เฉลย: ค. ถูก เพราะฐานนิยมคือข้อมูลที่มีจำนวนซ้ำกันมากที่สุดในชุดข้อมูลนั้น", "ง. ผิด เพราะนี่คือความหมายของ พิสัย (Range)", "จ. ผิด เพราะเกี่ยวข้องกับการหาค่าส่วนเบี่ยงเบนมาตรฐาน"] },
        { q: "2. ข้อมูลเชิงคุณภาพ (Qualitative Data) คือข้อมูลในข้อใด", options: ["ก. รายได้ต่อเดือน", "ข. อายุของพนักงาน", "ค. คะแนนสอบวิชาสถิติ", "ง. ระดับการศึกษา (เช่น ปวช., ปวส.)", "จ. จำนวนบุตรในครอบครัว"], answer: 3, explain: ["ก. ผิด เพราะรายได้เป็นข้อมูลเชิงปริมาณ (แบบต่อเนื่อง) ที่วัดค่าเป็นตัวเลขจริง", "ข. ผิด เพราะอายุเป็นข้อมูลเชิงปริมาณ ที่บอกระยะเวลาและนำมาหาค่าเฉลี่ยได้", "ค. ผิด เพราะคะแนนสอบเป็นข้อมูลเชิงปริมาณ ที่ใช้วัดระดับความรู้เป็นตัวเลข", "เฉลย: ง. ถูก เพราะเป็นข้อมูลที่ใช้จำแนกกลุ่ม หรือบอกคุณสมบัติ (Attribute) ไม่ใช่ตัวเลขที่นำมาบวกลบคูณหารกันได้", "จ. ผิด เพราะจำนวนบุตรเป็นข้อมูลเชิงปริมาณ (แบบไม่ต่อเนื่อง) ที่ได้จากการนับ"] },
        { q: "3. ในโปรแกรมสำเร็จรูปทางสถิติ ส่วนที่ใช้กำหนดชื่อตัวแปรและชนิดของข้อมูลเรียกว่าอะไร", options: ["ก. Data View", "ข. Variable View", "ค. Output Viewer", "ง. Chart Editor", "จ. Toolbar"], answer: 1, explain: ["ก. ผิด เพราะ Data View ใช้สำหรับกรอกค่าตัวเลขหรือข้อมูลจริง", "เฉลย: ข. ถูก เพราะ Variable View เป็นหน้าต่างสำหรับตั้งชื่อตัวแปร กำหนดประเภท และค่าความหมายของรหัส", "ค. ผิด เพราะเป็นหน้าต่างแสดงผลลัพธ์จากการคำนวณ", "ง. ผิด เพราะใช้สำหรับตกแต่งแผนภูมิ", "จ. ผิด เพราะเป็นแถบเครื่องมือลัดในการใช้งาน"] },
        { q: "4. การเก็บรวบรวมข้อมูลด้วย \"แบบสอบถาม\" (Questionnaire) มักนิยมใช้มาตรวัดแบบใดมากที่สุด", options: ["ก. นามบัญญัติ (Nominal Scale)", "ข. เรียงลำดับ (Ordinal Scale)", "ค. อันตรภาค (Interval Scale) เช่น ลิเคิร์ทสเกล 5 ระดับ", "ง. อัตราส่วน (Ratio Scale)", "จ. ไม่มีข้อใดถูก"], answer: 2, explain: ["ก. ผิด เพราะใช้สำหรับจำแนกกลุ่ม เช่น เพศ อาชีพ", "ข. ผิด เพราะใช้บอกลำดับแต่บอกระยะห่างที่แน่นอนไม่ได้", "เฉลย: ค. ถูก เพราะ Likert Scale 5 ระดับ (เห็นด้วยมากที่สุด - น้อยที่สุด) เป็นมาตรฐานในการวัดทัศนคติ", "ง. ผิด เพราะเป็นมาตรวัดที่มีศูนย์แท้ เช่น น้ำหนัก ส่วนสูง", "จ. ผิด เพราะข้อ ค เป็นคำตอบที่ถูกต้องที่สุดในการทำวิจัยทั่วไป"] },

        { q: "7. ค่า \"ออกเทน\" (Octane Number) เป็นตัวเลขที่บอกคุณภาพของน้ำมันชนิดใด?", options: ["ก. น้ำมันดีเซล", "ข. น้ำมันก๊าด", "ค. น้ำมันเบนซิน", "ง. น้ำมันเตา", "จ. น้ำมันหล่อลื่น"], answer: 2, explain: ["ก. ผิด เพราะดีเซลใช้ค่าซีเทน", "ข. ผิด เพราะไม่ระบุค่านี้", "เฉลย: ค. ถูก เพราะเป็นค่าแสดงประสิทธิภาพการต้านทานการชิงจุดระเบิดในเครื่องยนต์เบนซิน", "ง. ผิด เพราะวัดจากความหนืด", "จ. ผิด เพราะวัดจากค่าความหนืด"] },
        { q: "8. พอลิเมอร์ในข้อใดจัดเป็น \"พอลิเมอร์ธรรมชาติ\" ทั้งหมด?", options: ["ก. แป้ง, ยางพารา, โปรตีน", "ข. พลาสติก, ไนลอน, แป้ง", "ค. ยางสังเคราะห์, เซลลูโลส, โปรตีน", "ง. พีวีซี, ยางพารา, สำลี", "จ. โฟม, ไหม, ขนสัตว์"], answer: 0, explain: ["เฉลย: ก. ถูก เพราะสารทั้งสามพบได้ในสิ่งมีชีวิตและธรรมชาติ", "ข. ผิด เพราะพลาสติกและไนลอนเป็นสารสังเคราะห์", "ค. ผิด เพราะยางสังเคราะห์ผลิตจากปิโตรเคมี", "ง. ผิด เพราะพีวีซีเป็นสารสังเคราะห์", "จ. ผิด เพราะโฟมเป็นสารสังเคราะห์"] },
        { q: "9. เครื่องใช้ไฟฟ้าในธุรกิจข้อใดที่ใช้หลักการเปลี่ยนพลังงานไฟฟ้าเป็นพลังงานกล?", options: ["ก. เตารีดไฟฟ้า", "ข. พัดลมระบายอากาศ", "ค. หลอดไฟฟ้าแอลอีดี", "ง. หม้อหุงข้าว", "จ. เครื่องปิ้งขนมปัง"], answer: 1, explain: ["ก. ผิด เพราะเปลี่ยนเป็นพลังงานความร้อน", "เฉลย: ข. ถูก เพราะใช้มอเตอร์เปลี่ยนไฟฟ้าเป็นการหมุนของใบพัด", "ค. ผิด เพราะเปลี่ยนเป็นพลังงานแสง", "ง. ผิด เพราะเปลี่ยนเป็นพลังงานความร้อน", "จ. ผิด เพราะเปลี่ยนเป็นพลังงานความร้อน"] },
        { q: "10. คลื่นแม่เหล็กไฟฟ้าชนิดใดที่นิยมใช้ในรีโมทคอนโทรลสำหรับควบคุมอุปกรณ์ในธุรกิจ?", options: ["ก. คลื่นวิทยุ", "ข. คลื่นไมโครเวฟ", "ค. รังสีอินฟราเรด", "ง. รังสีอัลตราไวโอเลต", "จ. รังสีเอ็กซ์"], answer: 2, explain: ["ก. ผิด เพราะใช้ในการส่งสัญญาณวิทยุ/โทรทัศน์", "ข. ผิด เพราะใช้ในการสื่อสารดาวเทียมหรือปรุง", "เฉลย: ค. ถูก เพราะมีช่วงคลื่นที่พอเหมาะในการส่งสัญญาณระยะใกล้และราคาถูก", "ง. ผิด เพราะใช้ฆ่าเชื้อโรค", "จ. ผิด เพราะใช้ในการแพทย์/อุตสาหกรรมตรวจสอบ"] }
    ],

    // --------------------------------------------
    // 44: เศรษฐศาสตร์เบื้องต้น (เพิ่มใหม่)
    // --------------------------------------------
    "เศรษฐศาสตร์เบื้องต้น": [
        { q: "1. ปัญหาพื้นฐานทางเศรษฐศาสตร์เรื่อง \"จะผลิตอะไร\" (What) หมายถึงข้อใด", options: ["ก. ผลิตอย่างไรให้ประหยัดต้นทุนที่สุด", "ข. ผลิตเพื่อตอบสนองความต้องการของใคร", "ค. จะผลิตสินค้าและบริการชนิดใดและจำนวนเท่าใด", "ง. จะผลิตเมื่อใดจึงจะเหมาะสมกับฤดูกาล", "จ. จะผลิตที่ไหนเพื่อให้ใกล้แหล่งวัตถุดิบ"], answer: 2, explain: ["ก. ผิด เพราะเป็นปัญหาเรื่อง How (เทคนิคการผลิต)", "ข. ผิด เพราะเป็นปัญหาเรื่อง For Whom (การจัดสรรให้ผู้บริโภค)", "เฉลย: ค. ถูก เพราะเป็นการตัดสินใจเลือกชนิดและปริมาณสินค้าจากทรัพยากรที่มีจำกัด", "ง. ผิด เพราะไม่ใช่ปัญหาพื้นฐานหลักทางเศรษฐศาสตร์", "จ. ผิด เพราะเป็นเรื่องทำเลที่ตั้ง ไม่ใช่การตัดสินใจเชิงทรัพยากรพื้นฐาน"] },
        { q: "2. ตามกฎของอุปสงค์ (Law of Demand) ความสัมพันธ์ระหว่างราคากับปริมาณซื้อเป็นอย่างไร", options: ["ก. เมื่อราคาสูงขึ้น ปริมาณซื้อจะสูงขึ้นตาม", "ข. เมื่อราคาสูงขึ้น ปริมาณซื้อจะลดลง", "ค. เมื่อราคาต่ำลง ปริมาณซื้อจะลดลง", "ง. ราคาไม่มีผลต่อการตัดสินใจซื้อของผู้บริโภค", "จ. เมื่อรายได้สูงขึ้น ปริมาณซื้อจะลดลงเสมอ"], answer: 1, explain: ["ก. ผิด เพราะขัดกับกฎอุปสงค์ที่ราคากับปริมาณซื้อต้องสวนทางกัน", "เฉลย: ข. ถูก เพราะตามกฎอุปสงค์ เมื่อราคาสินค้าสูงขึ้น ผู้บริโภคจะซื้อน้อยลง (Inverse Relationship)", "ค. ผิด เพราะราคาต่ำลงต้องดึงดูดให้ซื้อเพิ่มขึ้น", "ง. ผิด เพราะราคาคือตัวแปรหลักที่กำหนดปริมาณซื้อ", "จ. ผิด เพราะเป็นเรื่องของปัจจัยรายได้ ไม่ใช่กฎของอุปสงค์โดยตรง"] },
        { q: "3. หากราคาไข่ไก่ในตลาดสูงขึ้นมาก พฤติกรรมของผู้ผลิตตามกฎของอุปทาน (Law of Supply) จะเป็นอย่างไร", options: ["ก. ลดปริมาณการผลิตลงเพื่อประหยัดต้นทุน", "ข. เลิกทำการผลิตเพราะกลัวขายไม่ออก", "ค. เพิ่มปริมาณการผลิตเพื่อหวังกำไรที่มากขึ้น", "ง. คงปริมาณการผลิตไว้เท่าเดิมเพื่อรักษาสมดุล", "จ. ลดราคาขายลงเพื่อให้แข่งขันกับรายอื่นได้"], answer: 2, explain: ["ก. ผิด เพราะขัดกับกฎอุปทานที่ราคากับปริมาณขายต้องไปในทิศทางเดียวกัน", "ข. ผิด เพราะราคาสูงคือโอกาสในการทำกำไร", "เฉลย: ค. ถูก เพราะเมื่อราคาสูงขึ้น ผู้ผลิตจูงใจที่จะเสนอขายสินค้ามากขึ้น (Direct Relationship)", "ง. ผิด เพราะผู้ผลิตมักปรับตัวตามราคาตลาดเพื่อกำไรสูงสุด", "จ. ผิด เพราะผู้ขายมักขายตามราคาตลาดที่สูงขึ้น ไม่ลดราคาในภาวะที่ขายได้ราคาดี"] },
        { q: "4. สภาวะดุลยภาค (Equilibrium) ในตลาดเกิดขึ้นที่จุดใด", options: ["ก. จุดที่อุปสงค์ส่วนเกินมีค่ามากที่สุด", "ข. จุดที่อุปทานส่วนเกินมีค่ามากที่สุด", "ค. จุดที่ปริมาณอุปสงค์เท่ากับปริมาณอุปทานพอดี", "ง. จุดที่ผู้ขายตั้งราคาสินค้าไว้สูงที่สุด", "จ. จุดที่ผู้ซื้อต้องการจ่ายเงินน้อยที่สุด"], answer: 2, explain: ["ก. ผิด เพราะอุปสงค์ส่วนเกินทำให้เกิดสภาวะสินค้าขาดแคลน", "ข. ผิด เพราะอุปทานส่วนเกินทำให้เกิดสภาวะสินค้าล้นตลาด", "เฉลย: ค. ถูก เพราะเป็นจุดสมดุลที่ความต้องการซื้อและความต้องการขายเท่ากันพอดี", "ง. ผิด เพราะราคาสูงเกินไปจะเกิดสินค้าล้นตลาด ไม่ใช่ดุลยภาพ", "จ. ผิด เพราะราคาต่ำเกินไปจะเกิดสินค้าขาดตลาด ไม่ใช่ดุลยภาพ"] },
        { q: "5. สินค้าชนิดใดต่อไปนี้มี \"ความยืดหยุ่นของอุปสงค์ต่อราคา\" น้อยที่สุด (Inelastic)", options: ["ก. กระเป๋าแฟชั่นราคาแพง", "ข. รถยนต์ส่วนบุคคล", "ค. ยารักษาโรคประจำตัว", "ง. เครื่องประดับทองคำ", "จ. ตั๋วเข้าชมภาพยนตร์"], answer: 2, explain: ["ก. ผิด เพราะเป็นสินค้าฟุ่มเฟือย เปลี่ยนแปลงการซื้อได้ง่ายเมื่อราคาเปลี่ยน", "ข. ผิด เพราะเป็นสินค้ามูลค่าสูงที่มีความยืดหยุ่นมาก", "เฉลย: ค. ถูก เพราะเป็นสินค้าจำเป็น ขาดไม่ได้ แม้ราคาจะเปลี่ยนคนก็ยังต้องซื้อในปริมาณเท่าเดิม", "ง. ผิด เพราะเป็นสินค้าฟุ่มเฟือย มีความยืดหยุ่นสูง", "จ. ผิด เพราะเป็นสินค้าบันเทิงที่มีความยืดหยุ่นสูง"] },
        { q: "6. เส้นอุปสงค์ (Demand Curve) ที่มีลักษณะทอดลงจากซ้ายไปขวา แสดงถึงความสัมพันธ์แบบใด", options: ["ก. แปรผันตามกัน", "ข. แปรผกผันกัน", "ค. ไม่มีความสัมพันธ์ต่อกัน", "ง. เป็นเส้นขนานกับแกนราคาเสมอ", "จ. เป็นความสัมพันธ์แบบทวีคูณ"], answer: 1, explain: ["ก. ผิด เพราะความสัมพันธ์แปรผันตามกันเป็นลักษณะของอุปทาน", "เฉลย: ข. ถูก เพราะแสดงทิศทางตรงกันข้ามระหว่างราคาและปริมาณ (Slope เป็นลบ)", "ค. ผิด เพราะเส้นกราฟระบุความสัมพันธ์ชัดเจน", "ง. ผิด เพราะนั่นหมายถึงความยืดหยุ่นเป็นศูนย์ซึ่งไม่ใช่ลักษณะทั่วไป", "จ. ผิด เพราะในระดับเบื้องต้นความสัมพันธ์เป็นเชิงเส้นแปรผกผัน"] },

// ================= ตัวแปรเกมและฟังก์ชัน =================
let currentLevel = "";
let currentTerm = "";
let currentGroup = "";
let currentSubject = "";
let questions = [];
let qIndex = 0;
let score = 0;

// ฟังก์ชันซ่อนหน้าทั้งหมด
function hideAll() {
    const pages = document.querySelectorAll('.container');
    pages.forEach(p => p.style.display = 'none');
}

// ฟังก์ชันแสดงหน้าตาม ID
function showPage(pageId) {
    hideAll();
    document.getElementById(pageId).style.display = "block";
}

// เริ่มต้น
function goLevel() {
    showPage('page_level');
}

// เลือกระดับชั้น
function selectLevel(level) {
    currentLevel = level;
    showPage('page_term');
    
    const terms = Object.keys(courseData[level]);
    let html = "";
    terms.forEach(t => {
        html += `<button onclick="selectTerm('${t}')">ภาคเรียนที่ ${t}</button>`;
    });
    document.getElementById("term_buttons").innerHTML = html;
    document.getElementById("term_title").innerText = `ระดับชั้น ${level} - เลือกภาคเรียน`;
}

// เลือกภาคเรียน
function selectTerm(term) {
    currentTerm = term;
    showPage('page_course_group');
    document.getElementById("group_title").innerText = `ระดับ ${currentLevel} เทอม ${currentTerm}`;
}

function backToTerm() {
    showPage('page_term');
}

// เลือกกลุ่มวิชา (พื้นฐาน/อาชีพ)
function showSubjectList(group) {
    currentGroup = group;
    showPage('page_subject_dynamic');
    
    const subjects = courseData[currentLevel][currentTerm][group];
    let html = "";
    subjects.forEach(sub => {
        html += `<button onclick="selectSubject('${sub}')">${sub}</button>`;
    });
    document.getElementById("subject_list").innerHTML = html;
    document.getElementById("subject_title").innerText = group === 'basic' ? "รายวิชาพื้นฐาน" : "รายวิชาชีพ";
}

function backToGroup() {
    showPage('page_course_group');
}

// เลือกรายวิชาแล้วเริ่มเกม
function selectSubject(subject) {
    currentSubject = subject;
    
    if(questionsDatabase[subject]) {
        questions = questionsDatabase[subject];
        qIndex = 0;
        score = 0;
        showQuestion();
    } else {
        alert("ขออภัย รายวิชานี้ยังไม่มีข้อสอบในระบบ");
    }
}

// แสดงคำถาม
function showQuestion(){
    showPage('page_game');
    
    let currentQ = questions[qIndex];
    document.getElementById("question_text").innerText = currentQ.q;
    
    let html="";
    currentQ.options.forEach((c,i)=>{
        html += `<button class="choice" onclick="selectChoice(${i})">${c}</button>`;
    });
    document.getElementById("choices").innerHTML = html;
}

// ตรวจคำตอบและแสดงเฉลยทันที (Logic: ผิด=แดง, ถูก=เขียวเสมอ)
function selectChoice(i){
    showPage('page_check');
    
    let currentQ = questions[qIndex];
    let correct = currentQ.answer;
    let resultHeader = document.getElementById("result_header");
    let explainArea = document.getElementById("explain_area");
    
    // 1. ส่วนหัวแสดงผล ถูก/ผิด
    if(i === correct){ 
        resultHeader.innerHTML = "✔ ถูกต้อง! เก่งมาก";
        resultHeader.className = "result-header result-correct";
        score++; 
    } else { 
        resultHeader.innerHTML = "✘ ผิดครับ! ลองดูเฉลยนะ"; 
        resultHeader.className = "result-header result-wrong";
    }

    // 2. ส่วนแสดงคำอธิบาย
    let explainHTML="";
    currentQ.explain.forEach((expl, index) => {
        let className = "explain-box";

        // Logic:
        // 1. ข้อที่ถูก (index === correct) ต้องเป็น สีเขียว เสมอ (ไม่ว่าจะตอบถูกหรือผิด)
        // 2. ข้อที่เราเลือก (index === i) ถ้าเลือกผิด ให้เป็น สีแดง
        
        if (index === correct) {
            className += " explain-correct"; // ถูกต้อง -> เขียวเสมอ
        } else if (index === i) {
            className += " explain-wrong";   // เลือกผิด -> แดง
        }
        
        explainHTML += `<div class="${className}">${expl}</div>`;
    });
    explainArea.innerHTML = explainHTML;
}

// ไปข้อถัดไป
function nextQuestion(){
    qIndex++;
    if(qIndex >= questions.length) finishGame();
    else showQuestion();
}

// จบเกม
function finishGame(){
    showPage('page_score');
    
    let percent = (score / questions.length) * 100;
    let msg = "";
    if(percent >= 80) msg = "สุดยอด! คุณเก่งมาก";
    else if(percent >= 50) msg = "ผ่านเกณฑ์ พยายามต่อไปนะ";
    else msg = "ไม่เป็นไร ลองทบทวนแล้วมาเล่นใหม่นะ";
    
    document.getElementById("final_score").innerText = `${score} / ${questions.length} คะแนน`;
    document.getElementById("score_message").innerText = msg;
}

function backToLevel(){
    goLevel();
}
